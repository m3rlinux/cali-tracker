<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cali Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0c;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #272727;
  --border2: #333;
  --text: #eeebe6;
  --muted: #7a7672;
  --muted2: #444;
  --accent: #c8f060;
  --accent2: #8fb840;
  --teal: #4dd9a0;
  --coral: #f07060;
  --amber: #f0b840;
  --purple: #b090f0;
  --blue: #60a8f0;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 10px;
  /* pair colors */
  --p0: #b090f0;
  --p1: #ee412a;
  --p2: #47d2eb;
  --p3: #df60f0;
  --p4: #f09138;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; width: 100%; max-width: 560px; margin: 0 auto; overflow-x: hidden; }

.app-header { padding: 18px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.app-title { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; min-width: 0; }

/* USER MENU */
.user-menu-wrap { position: relative; flex-shrink: 0; }
.name-badge { font-size: 12px; color: var(--muted); font-family: var(--mono); cursor: pointer; border: 1px solid var(--border2); border-radius: 20px; padding: 4px 10px; user-select: none; max-width: 42vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r); min-width: 160px; z-index: 50; overflow: hidden; display: none; }
.user-menu.open { display: block; }
.user-menu-item { padding: 11px 14px; font-size: 13px; font-family: var(--sans); color: var(--text); cursor: pointer; border-bottom: 1px solid var(--border); }
.user-menu-item:last-child { border-bottom: none; }
.user-menu-item:active { background: var(--surface2); }

.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.page { display: none; }
.page.active { display: block; }

/* SESSION BAR */
.sess-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sess-info { display: flex; align-items: baseline; gap: 8px; }
.sess-num-big { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--accent); }
.sess-date-sm { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sess-nav { display: flex; gap: 6px; }
#sess-bar-right { display: flex; align-items: center; gap: 8px; }
.save-btn-sm { padding: 7px 14px; background: var(--accent); color: #0c0c0c; border: none; border-radius: var(--r); font-size: 12px; font-weight: 600; font-family: var(--sans); cursor: pointer; }
.save-btn-sm:active { background: var(--accent2); }
.sess-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.sess-btn:active { background: var(--surface2); }

/* STEP */
.step-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 0; }
.step-label { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.step-dots { display: flex; gap: 5px; }
.step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); transition: background .2s; }
.step-dot.active { background: var(--accent); }
.step-dot.done { background: var(--muted2); }

.step-nav { display: flex; align-items: center; padding: 10px 16px 14px; gap: 10px; }
.nav-btn { flex: 1; padding: 11px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); border-radius: var(--r); font-size: 13px; font-family: var(--sans); cursor: pointer; }
.nav-btn:active { background: var(--surface2); }
.nav-btn:disabled { opacity: .3; cursor: default; }
.save-btn { flex: 2; padding: 11px; background: var(--accent); color: #0c0c0c; border: none; border-radius: var(--r); font-size: 14px; font-weight: 600; font-family: var(--sans); cursor: pointer; }
.save-btn:active { background: var(--accent2); }

.step-content { padding: 14px 16px 0; }

/* VARIANT SELECT */
.variant-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.variant-select-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
.variant-select { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: var(--sans); color: var(--text); cursor: pointer; appearance: none; -webkit-appearance: none; }
.variant-select:focus { outline: none; }
.variant-select.col-p0 { border-color: var(--p0); color: var(--p0); }
.variant-select.col-p1 { border-color: var(--p1); color: var(--p1); }
.variant-select.col-p2 { border-color: var(--p2); color: var(--p2); }
.variant-select.col-p3 { border-color: var(--p3); color: var(--p3); }
.variant-select.col-p4 { border-color: var(--p4); color: var(--p4); }
.variant-prev-sm { font-size: 10px; color: var(--muted2); font-family: var(--mono); flex-shrink: 0; }

/* PAIR HEADER */
.pair-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.pair-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pair-title { font-size: 14px; font-weight: 600; }
.pair-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: auto; }

/* EX BLOCK */
.ex-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
.ex-head { padding: 9px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.ex-color-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.ex-name { font-size: 12px; font-weight: 500; }

/* TIME BLOCK */
.ex-time-pr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.ex-vc-card { background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 10px; }
.ex-vc-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.ex-vc-input { width: 100%; background: transparent; border: none; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; appearance: textfield; outline: none; }
.ex-vc-input::-webkit-inner-spin-button, .ex-vc-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.ex-vc-unit { font-size: 10px; color: var(--muted2); font-family: var(--mono); text-align: center; margin-top: 2px; }
.ex-vc-prev { font-size: 10px; color: var(--muted); font-family: var(--mono); text-align: center; margin-top: 2px; }
.ex-vc-target-val { font-size: 22px; font-family: var(--mono); font-weight: 500; text-align: center; }

/* TIME SETS */
.time-sets { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.time-set-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.time-set-label { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; }
.time-set-input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; appearance: textfield; }
.time-set-input::-webkit-inner-spin-button, .time-set-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.time-set-input:focus { outline: none; border-color: var(--purple); }
.time-set-unit { font-size: 11px; color: var(--muted2); font-family: var(--mono); width: 20px; }
.time-total-bar { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.time-total-label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.time-total-val { font-family: var(--mono); font-size: 14px; font-weight: 500; }
.time-total-target { font-size: 10px; color: var(--muted2); font-family: var(--mono); }

/* REPS SETS */
.set-main { flex-direction: column; align-items: stretch; gap: 6px; }
.set-main > div[id^="intensity-f-"] { align-self: center; width: 100%; text-align: center; }
.sets-grid { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.set-row { display: flex; align-items: center; gap: 8px; }
.set-label { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; }
.set-inputs { display: flex; gap: 6px; flex: 1; }
.set-main { display: flex; align-items: center; gap: 8px; }
.set-controls { flex: 1; min-width: 0; display: flex; gap: 6px; }
.si-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.si-lbl { font-size: 9px; color: var(--muted2); font-family: var(--mono); text-align: center; text-transform: uppercase; letter-spacing: .04em; }
.si-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; appearance: textfield; }
.si-input::-webkit-inner-spin-button, .si-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.si-input.reps:focus { border-color: var(--teal); }
.si-input.cluster:focus { border-color: var(--amber); }
.set-prev { font-family: var(--mono); font-size: 10px; color: var(--muted2); white-space: nowrap; min-width: 44px; text-align: right; }
.cluster-hint { font-size: 10px; color: var(--amber); font-family: var(--mono); text-align: center; padding: 6px 12px 10px; opacity: .7; }
.difficulty-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 10px; border-top: 1px solid var(--border); }
.difficulty-label { font-size: 10px; color: var(--muted); font-family: var(--mono); letter-spacing: .05em; }
.difficulty-options { display: flex; gap: 6px; }
.difficulty-btn { width: 28px; height: 28px; border: 1px solid var(--border2); border-radius: 7px; background: var(--bg); cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.difficulty-btn.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* HISTORY */
#page-history { padding: 16px; }
.history-empty { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 13px; line-height: 1.9; }
.history-sess { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.history-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.history-sess-num { font-family: var(--mono); font-size: 13px; color: var(--accent); }
.history-meta { display: flex; align-items: center; gap: 10px; }
.history-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.delete-btn { background: none; border: 1px solid var(--border2); border-radius: 6px; color: var(--muted); font-size: 11px; padding: 3px 7px; cursor: pointer; }
.delete-btn:active { background: var(--coral); color: #0c0c0c; border-color: var(--coral); }
.history-body { padding: 10px 14px; display: none; border-top: 1px solid var(--border); }
.history-body.open { display: block; }
.history-pair-header { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 0 4px; border-top: 1px solid var(--border); margin-top: 4px; }
.history-pair-header:first-child { border-top: none; margin-top: 0; }
.history-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.history-row:last-child { border-bottom: none; }
.history-key { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.history-val { font-family: var(--mono); font-weight: 500; font-size: 12px; display: flex; align-items: center; gap: 4px; }
.delta-pos { color: var(--teal); font-size: 10px; }
.delta-neg { color: var(--coral); font-size: 10px; }

/* PROGRESS */
#page-progress { padding: 16px; }
.prog-section { margin-bottom: 24px; }
.prog-title { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.prog-chart-wrap { padding-bottom: 22px; }
.prog-chart { height: 80px; display: flex; align-items: flex-end; gap: 4px; }
.prog-bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 4px; position: relative; }
.prog-bar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); font-family: var(--mono); }
.prog-val { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 9px; font-family: var(--mono); font-weight: 500; white-space: nowrap; }
.prog-stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 6px; }
.prog-stat { background: var(--surface); border-radius: 8px; padding: 10px; text-align: center; }
.prog-stat-val { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.prog-stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
.prog-pair-header { font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; padding: 14px 0 6px; border-top: 1px solid var(--border); margin-top: 4px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
.modal-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; font-size: 16px; color: var(--text); font-family: var(--sans); }
.modal-input:focus { outline: none; border-color: var(--accent); }
.modal-btn { width: 100%; margin-top: 12px; padding: 12px; background: var(--accent); color: #0c0c0c; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); }
.modal-btn-ghost { width: 100%; margin-top: 8px; padding: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; font-size: 14px; cursor: pointer; font-family: var(--sans); }

.toast { text-align: center; font-size: 12px; color: var(--accent); font-family: var(--mono); padding: 8px; opacity: 0; transition: opacity .3s; }
.toast.show { opacity: 1; }

/* SLIDE ANIMATION */
#step-content { transition: transform .22s ease, opacity .22s ease; }
#step-content.slide-out-left  { transform: translateX(-60px); opacity: 0; pointer-events: none; }
#step-content.slide-out-right { transform: translateX(60px);  opacity: 0; pointer-events: none; }
#step-content.slide-in-left   { transform: translateX(60px);  opacity: 0; pointer-events: none; }
#step-content.slide-in-right  { transform: translateX(-60px); opacity: 0; pointer-events: none; }

/* +/- BUTTONS */
.stepper-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.stepper-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none; -webkit-user-select: none; }
.stepper-btn:active { background: var(--border2); }
.stepper-input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; appearance: textfield; }
.stepper-input::-webkit-inner-spin-button, .stepper-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.stepper-input:focus { outline: none; border-color: var(--teal); }

/* INTENSITY LABEL */
.intensity-lbl { font-size: 9px; font-family: var(--mono); text-align: center; margin-top: 3px; letter-spacing: .04em; text-transform: uppercase; }
.intensity-forza     { color: var(--coral); }
.intensity-ipertrofia { color: var(--teal); }
.intensity-mista { color: var(--amber); }
.intensity-resistenza { color: var(--blue); }

/* SESS BAR — editing mode */
.sess-bar-editing { background: var(--surface2); border-bottom: 1px solid var(--border2); }
.sess-edit-label { font-family: var(--mono); font-size: 11px; color: var(--amber); }

@media (max-width: 380px) {
  .set-main { flex-direction: column; align-items: stretch; gap: 6px; }
  .set-label { width: auto; }
  .set-controls { width: 100%; }
}

@media (max-width: 420px) {
  .app-header { padding: 14px 12px 10px; }
  .step-bar { padding: 10px 12px 0; }
  .step-content { padding: 12px 12px 0; }
  .step-nav { padding: 10px 12px 14px; }
  .sess-bar { padding: 10px 12px; }
  .stepper-btn { width: 30px; height: 30px; }
  .stepper-input, .time-set-input, .ex-vc-input { font-size: 20px; }
  .time-total-bar { flex-wrap: wrap; }
  .time-total-target { width: 100%; }
}

@media (min-width: 768px) {
  body { max-width: 620px; }
  .app-header { padding: 20px 18px 12px; }
  .step-bar { padding: 12px 18px 0; }
  .step-content { padding: 16px 18px 0; }
  .step-nav { padding: 12px 18px 16px; }
  .sess-bar { padding: 14px 18px; }
  .name-badge { max-width: 260px; }
}

/* SLIDE ANIMATION */
#step-content { transition: transform .22s ease, opacity .22s ease; }
#step-content.slide-out-left  { transform: translateX(-60px); opacity: 0; pointer-events: none; }
#step-content.slide-out-right { transform: translateX(60px);  opacity: 0; pointer-events: none; }
#step-content.slide-in-left   { transform: translateX(60px);  opacity: 0; pointer-events: none; }
#step-content.slide-in-right  { transform: translateX(-60px); opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">Cali Tracker <span id="version" style="color:var(--muted2);font-size:10px;letter-spacing:.04em">v3.0.1</span></div>
  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
  <div class="name-badge" id="lang-badge" onclick="toggleLang()" title="Lingua esercizi / Exercise language">IT</div>
  <div class="user-menu-wrap">
    <div class="name-badge" id="name-badge" onclick="toggleUserMenu()">— imposta nome</div>
    <div class="user-menu" id="user-menu">
      <div class="user-menu-item" onclick="openRenameModal()">✎ Rinomina</div>
      <div class="user-menu-item" onclick="exportData()">↓ Esporta dati</div>
      <div class="user-menu-item" onclick="document.getElementById('import-file').click()">↑ Importa dati</div>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('log')">Inserisci</div>
  <div class="tab" onclick="switchTab('history')">Storico</div>
  <div class="tab" onclick="switchTab('progress')">Progressi</div>
</div>

<div class="page active" id="page-log">
  <div class="sess-bar" id="sess-bar">
    <div class="sess-info">
      <div class="sess-num-big" id="sess-num">—</div>
      <div class="sess-date-sm" id="sess-date">—</div>
    </div>
    <div id="sess-bar-right"></div>
  </div>
  <div class="step-bar">
    <div class="step-label" id="step-label"></div>
    <div class="step-dots" id="step-dots"></div>
  </div>
  <div class="step-content" id="step-content"></div>
  <div class="step-nav">
    <button class="nav-btn" id="btn-prev" onclick="goStep(-1)" style="display:none">‹ Indietro</button>
    <button class="nav-btn" id="btn-next" onclick="goStep(1)" style="display:none">Avanti ›</button>
  </div>
  <div class="toast" id="toast">✓ Sessione salvata</div>
</div>

<div class="page" id="page-history">
  <div id="history-list"><div class="history-empty">Nessuna sessione ancora.</div></div>
</div>

<div class="page" id="page-progress">
  <div id="progress-content"><div class="history-empty">Inserisci almeno 2 sessioni<br>per vedere i progressi.</div></div>
</div>

<script>
const VERSION = '3.0.1';
const KEY_NAME = 'cali_name';
const MAX_SETS = 6;
const TIME_TARGET_LOW = 50;
const TIME_TARGET_HIGH = 60;
const DEFAULT_DIFFICULTY_KEY = 'medio';
const DIFFICULTY_LEVELS = [
  { key: 'facile', emoji: '😊', title: 'Facile' },
  { key: 'medio', emoji: '😑', title: 'Medio' },
  { key: 'difficile', emoji: '😓', title: 'Difficile' },
  { key: 'limite', emoji: '🥵', title: 'Limite' }
];
function sessKey() { return 'cali_sessions_' + (getName().toLowerCase().replace(/\s+/g,'_') || 'default'); }
function getData() { try { return JSON.parse(localStorage.getItem(sessKey())) || {}; } catch(e) { return {}; } }
function saveData(d) { localStorage.setItem(sessKey(), JSON.stringify(d)); }
function getName() { return localStorage.getItem(KEY_NAME) || ''; }

// ── MIGRAZIONE v3 — varianti rinominate in italiano ──
// I nomi variante salvati nello storico devono corrispondere a exercises.json.
// Mappa per station: vecchio nome (pre-3.0.0) → nuovo nome italiano.
const VARIANT_MIGRATION_FLAG = 'cali_variants_v3';
const LEGACY_VARIANT_MAP = {
  p0s1: {
    'Pike shrug': 'Scrollata in pike',
    'Box pike shrug': 'Scrollata in pike su box',
    'Box pike shoulder tap': 'Tocco spalla in pike su box',
    'Wall walk': 'Camminata al muro',
    'Wall shrug': 'Scrollata al muro',

    'Press to HS (straddle)': 'Press in verticale (straddle)'
  },
  p0s2: {

    'Box pike hold': 'Tenuta in pike su box',
    'Wall pike hold': 'Tenuta in pike al muro',
    'Hold chest to wall': 'Tenuta petto al muro',
    'Wall one-leg alternato': 'Verticale al muro una gamba alternata',
    'Wall handstand': 'Verticale al muro',
    'Handstand': 'Verticale'
  },
  p1s1: {
    'Dead hang': 'Sospensione passiva',
    'Scapular pull up': 'Trazione scapolare',
    'Active hang': 'Sospensione attiva',
    'Pull up eccentrica': 'Trazione eccentrica',
    'Pull up': 'Trazione',
    'Chest pull up': 'Trazione al petto',
    'Muscle up eccentrica': 'Muscle up eccentrico'
  },
  p1s2: {
    'Shrimp squat assisted': 'Shrimp squat assistito',
    'Pistol squat assisted': 'Pistol squat assistito'
  },
  p2s1: {
    'Pushup inclinato': 'Piegamento inclinato',
    'Pushup eccentrica': 'Piegamento eccentrico',
    'Pushup': 'Piegamento',
    'Pushup piedi su rialzo': 'Piegamento piedi su rialzo',
    'Diamond pushup': 'Piegamento diamante',
    'Ring pushup': 'Piegamento agli anelli',
    'RTO pushup': 'Piegamento agli anelli RTO'
  },
  p2s2: {
    'Dead Bug': 'Dead bug',
    'Parallettes leg raise': 'Alzate gambe alle parallette',
    'Dragon flag eccentrica': 'Dragon flag eccentrico',
    'Dragon flag tuck': 'Dragon flag raccolto',
    'Front lever tuck': 'Front lever raccolto',
    'Front lever advanced tuck': 'Front lever raccolto avanzato',
    'Front lever one leg': 'Front lever una gamba'
  },
  p3s1: {
    'Row eccentrica': 'Rematore eccentrico',
    'Row': 'Rematore',
    'Row piedi su rialzo': 'Rematore piedi su rialzo',
    'Row archer': 'Rematore arciere',
    'Row wide one arm eccentrica': 'Rematore largo un braccio eccentrico',
    'Row one arm': 'Rematore un braccio'
  },
  p3s2: {
    'Glute bridge': 'Ponte glutei',
    'Arch hamstring isometric': 'Arch hamstring isometrico'
  },
  p4s1: {

    'Ring support hold': 'Tenuta in appoggio agli anelli',
    'Ring support hold RTO': 'Tenuta in appoggio agli anelli RTO',
    'Ring dip negativo': 'Dip agli anelli negativo',
    'Ring dip': 'Dip agli anelli',
    'Ring dip RTO finale': 'Dip agli anelli RTO finale',
    'Ring dip RTO': 'Dip agli anelli RTO',
    'Pike pushup': 'Piegamento in pike',
    'Wall HSPU negativo': 'HSPU al muro negativo',
    'Wall HSPU': 'HSPU al muro'
  },
  p4s2: {
    'Superman hold': 'Tenuta superman',
    'Kettlebell Swings': 'Swing con kettlebell',
    'Deadlifts': 'Stacchi',
    'German Hang': 'German hang',
    'Back lever tuck': 'Back lever raccolto',
    'Back lever advanced tuck': 'Back lever raccolto avanzato',
    'Back lever one leg': 'Back lever una gamba'
  }
};

function migrateSessionVariants(sess) {
  if (!sess || typeof sess !== 'object') return sess;
  Object.entries(sess).forEach(([stationKey, ex]) => {
    const map = LEGACY_VARIANT_MAP[stationKey];
    if (map && ex && typeof ex === 'object' && ex.variant && map[ex.variant]) {
      ex.variant = map[ex.variant];
    }
  });
  return sess;
}

function migrateAllSessions(sessions) {
  Object.values(sessions || {}).forEach(migrateSessionVariants);
  return sessions;
}

// Migra una sola volta i dati di TUTTI gli utenti salvati in localStorage
function runVariantMigration() {
  if (localStorage.getItem(VARIANT_MIGRATION_FLAG)) return;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith('cali_sessions_')) continue;
    try {
      const data = JSON.parse(localStorage.getItem(key)) || {};
      localStorage.setItem(key, JSON.stringify(migrateAllSessions(data)));
    } catch(e) { /* dati non parsabili: lasciali intatti */ }
  }
  localStorage.setItem(VARIANT_MIGRATION_FLAG, '1');
}

function getPrevSession(data, sessNum) {
  const prevNum = Object.keys(data)
    .map(Number)
    .filter(n => !isNaN(n) && n < sessNum)
    .sort((a, b) => b - a)[0];
  return prevNum != null ? (data[prevNum] || {}) : {};
}

let currentSess = 1;
let currentStep = 0;
let STEPS = []; // built dynamically from EXERCISES
let draftSession = {};       // in-memory session being edited/created
let draftDirty = false;      // true when current draft has unsaved changes
let _suppressTabGuard = false;

function cloneObj(obj) {
  return JSON.parse(JSON.stringify(obj || {}));
}

function getSavedSessionNumbers() {
  return Object.keys(getData()).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
}

function getNextSessionNumber() {
  const nums = getSavedSessionNumbers();
  return nums.length ? Math.max(...nums) + 1 : 1;
}

function getLastSavedSession() {
  const data = getData();
  const nums = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a, b) => b - a);
  const lastNum = nums[0];
  return lastNum != null ? cloneObj(data[lastNum] || {}) : {};
}

function resetDraftSession() {
  currentSess = getNextSessionNumber();
  currentStep = 0;
  editingSession = false;
  draftSession = getLastSavedSession();
  delete draftSession.date; // nuova sessione: precompila i valori, ma resta non salvata
  draftDirty = false;
}

function markDraftDirty() {
  draftDirty = true;
}

// ── EXERCISES (loaded from JSON) ──
// EXERCISES (exercises.json) è il file canonico: i nomi variante in localStorage
// sono SEMPRE quelli italiani. LANG_EXERCISES traduce solo la visualizzazione,
// mappando le varianti per posizione nell'array.
let EXERCISES = {};
let LANG_EXERCISES = null;

const KEY_LANG = 'cali_lang';
function getLang() { return localStorage.getItem(KEY_LANG) || 'it'; }

// pair color map
const PAIR_COLORS = { p0:'--p0', p1:'--p1', p2:'--p2', p3:'--p3', p4:'--p4' };
const PAIR_LABELS = {
  p0: 'Handstand',
  p1: 'Tirata verticale + Gambe anteriori',
  p2: 'Spinta orizzontale + Core',
  p3: 'Tirata orizzontale + Gambe posteriori',
  p4: 'Spinta verticale + Catena posteriore'
};
const PAIR_LABELS_EN = {
  p0: 'Handstand',
  p1: 'Vertical pull + Anterior legs',
  p2: 'Horizontal push + Core',
  p3: 'Horizontal pull + Posterior legs',
  p4: 'Vertical push + Posterior chain'
};

function pairColor(pKey) { return `var(${PAIR_COLORS[pKey] || '--muted'})`; }

// ── BUILD STEPS from EXERCISES ──
// Groups exercises by pX prefix, orders by pX then sY
function buildSteps() {
  const groups = {}; // { p0: [{stationKey:'p0s1', group}, ...], p1: [...], ... }
  Object.entries(EXERCISES).forEach(([groupKey, group]) => {
    const st = group.station; // e.g. "p0s1"
    const m = st.match(/^(p\d+)(s\d+)$/);
    if (!m) return;
    const [, px, sy] = m;
    if (!groups[px]) groups[px] = [];
    groups[px].push({ stationKey: st, px, sy, groupKey, group });
  });
  // sort each pair by sY, then sort pairs by pX
  const sortedPairs = Object.keys(groups).sort();
  const pairLabels = getLang() === 'en' && LANG_EXERCISES ? PAIR_LABELS_EN : PAIR_LABELS;
  STEPS = sortedPairs.map(px => {
    const stations = groups[px].sort((a,b) => a.sy.localeCompare(b.sy));
    return { px, label: pairLabels[px] || px.toUpperCase(), stations };
  });
}

function getMetric(stationKey, variant) {
  const group = Object.values(EXERCISES).find(g => g.station === stationKey);
  if (!group) return 'reps';
  if (variant) return group.metrics?.[variant] || 'reps';
  // No variant selected: check if ALL variants are time → default to time
  if (group.metrics && group.variants) {
    const allTime = group.variants.every(v => group.metrics[v] === 'time');
    if (allTime) return 'time';
  }
  return 'reps';
}

function getVariants(stationKey) {
  const group = Object.values(EXERCISES).find(g => g.station === stationKey);
  return group?.variants || [];
}

function getGroupEntry(stationKey) {
  return Object.entries(EXERCISES).find(([, g]) => g.station === stationKey) || [null, null];
}

function getGroupLabel(stationKey) {
  const [groupKey, group] = getGroupEntry(stationKey);
  if (!group) return stationKey;
  return LANG_EXERCISES?.[groupKey]?.label || group.label;
}

// Traduce un nome variante (canonico/italiano) nella lingua attiva, per posizione
function tVariant(stationKey, variant) {
  if (!variant || !LANG_EXERCISES) return variant;
  const [groupKey, group] = getGroupEntry(stationKey);
  if (!group?.variants) return variant;
  const idx = group.variants.indexOf(variant);
  if (idx === -1) return variant;
  return LANG_EXERCISES[groupKey]?.variants?.[idx] || variant;
}

function getGroupVariants(stationKey) {
  const group = Object.values(EXERCISES).find(g => g.station === stationKey);
  return group?.variants || [];
}

// ── LOAD EXERCISES ──
async function loadExercises() {
  document.getElementById('step-content').innerHTML = '<div style="padding:12px;font-family:var(--mono);font-size:11px;color:var(--muted)">Caricamento…</div>';
  try {
    const res = await fetch('exercises.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    EXERCISES = await res.json();
    LANG_EXERCISES = null;
    if (getLang() === 'en') {
      try {
        const resEn = await fetch('exercises.en.json');
        if (resEn.ok) LANG_EXERCISES = await resEn.json();
      } catch(e2) { /* fallback: labels italiane */ }
    }
    buildSteps();
  } catch(e) {
    document.getElementById('step-content').innerHTML = `<div style="padding:12px;font-family:var(--mono);font-size:11px;color:var(--coral)">Errore: ${e.message}</div>`;
    console.error('loadExercises failed:', e);
    EXERCISES = {};
    STEPS = [];
  }
}

// ── INIT ──
async function init() {
  runVariantMigration();
  const name = getName();
  if (!name) openNameModal();
  else document.getElementById('name-badge').textContent = name;
  document.getElementById('lang-badge').textContent = getLang().toUpperCase();
  await loadExercises();
  const hadTemp = restoreTempState();
  if (!hadTemp) {
    resetDraftSession();
  }
  renderSessBar();
  renderStepDots();
  renderStep();
  renderHistory();
  renderProgress();
  document.getElementById('version').textContent = 'v' + VERSION;
  // No localStorage write happens until the user presses Save.
}

function injectTempForm(formData) {
  if (!STEPS.length) return;
  const step = STEPS[currentStep];
  step.stations.forEach(({stationKey}) => {
    const obj = formData[stationKey];
    if (!obj) return;
    const selVariant = document.querySelector(`.variant-select[data-station="${stationKey}"]`);
    if (selVariant && obj.variant) {
      selVariant.value = obj.variant;
      selVariant.className = `variant-select col-${selVariant.dataset.px}`;
    }
    const metric = getMetric(stationKey, obj.variant || '');
    if (metric === 'time') {
      const prInput = document.querySelector(`[data-pr="${stationKey}"]`);
      if (prInput && obj.hold_max != null) { prInput.value = obj.hold_max; updateTimeTarget(stationKey); }
      obj.sets?.forEach((val, i) => {
        const ti = document.querySelector(`.time-set-input[data-ex="${stationKey}"][data-set="${i}"]`);
        if (ti && val != null) ti.value = val;
      });
      updateTimeTotal(stationKey);
    } else {
      obj.sets?.forEach(([f, c], i) => {
        const fi = document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="f"]`);
        const ci = document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="c"]`);
        if (fi && f != null) fi.value = f;
        if (ci && c != null) ci.value = c;
      });
      if (obj.difficulty) {
        const btn = document.querySelector(`.difficulty-btn[data-ex="${stationKey}"][data-level="${obj.difficulty}"]`);
        if (btn) setDifficulty(stationKey, obj.difficulty, btn);
      }
    }
  });
}

// ── SESSION NAV ──
let editingSession = false;

function resetCurrentDraft() {
  if (draftDirty && !confirm('La sessione corrente non è salvata. Scartare le modifiche e ricominciare?')) return;
  // Check for SW update when resetting the draft session
  if (window._swReg) window._swReg.update();
  resetDraftSession();
  renderSessBar();
  renderStepDots();
  goStepDirect(0);
}

function goStepDirect(idx) {
  currentStep = idx;
  renderStepDots();
  renderStep();
  window.scrollTo(0, 0);
}

function renderSessBar() {
  const s = draftSession || {};
  document.getElementById('sess-num').textContent = currentSess;
  document.getElementById('sess-date').textContent = s.date || '—';
  const bar = document.getElementById('sess-bar');
  const right = document.getElementById('sess-bar-right');
  const saveBtn = `<button class="save-btn-sm" onclick="saveSession()">Salva ✓</button>`;
  if (editingSession) {
    bar.classList.add('sess-bar-editing');
    right.innerHTML = `<span class="sess-edit-label">✎ modifica</span>${saveBtn}`;
  } else {
    bar.classList.remove('sess-bar-editing');
    right.innerHTML = `${saveBtn}<button class="nav-btn" onclick="resetCurrentDraft()" style="padding:6px 12px;font-size:11px;font-family:var(--mono)">↺ Reset</button>`;
  }
}

// ── STEP NAV ──
function renderStepDots() {
  document.getElementById('step-dots').innerHTML = Array.from({length: STEPS.length}, (_, i) => {
    const cls = i === currentStep ? 'active' : i < currentStep ? 'done' : '';
    return `<div class="step-dot ${cls}"></div>`;
  }).join('');
}

function goStep(d) {
  if (!STEPS.length) return;
  const next = currentStep + d;
  if (next < 0 || next >= STEPS.length) return;
  collectStep(currentStep);

  const el = document.getElementById('step-content');
  const outClass = d > 0 ? 'slide-out-left' : 'slide-out-right';
  const inClass  = d > 0 ? 'slide-in-left'  : 'slide-in-right';

  el.classList.add(outClass);
  setTimeout(() => {
    el.classList.remove(outClass);
    currentStep = next;
    renderStepDots();
    renderStep();
    window.scrollTo(0, 0);
    el.classList.add(inClass);
    // force reflow so transition fires
    void el.offsetWidth;
    el.classList.remove(inClass);
  }, 200);
}

function renderStep() {
  if (!STEPS.length) return;
  const step = STEPS[currentStep];
  document.getElementById('step-label').textContent = step.label;
  // Edge on Windows reports maxTouchPoints > 0 even without touchscreen
  // Use pointer type check as more reliable fallback
  const isTouch = ('ontouchstart' in window) ||
    (navigator.maxTouchPoints > 0 && !window.matchMedia('(pointer: fine)').matches);
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  if (btnPrev) btnPrev.style.display = !isTouch && currentStep > 0 ? '' : 'none';
  if (btnNext) btnNext.style.display = !isTouch && currentStep < STEPS.length - 1 ? '' : 'none';
  const data = getData();
  const s = draftSession || {};
  const prev = getPrevSession(data, currentSess);
  renderSessBar();
  renderPairStep(currentStep, s, prev);
}

// ── VARIANT SELECT ──
function variantSelectHTML(stationKey, selectedVariant, prevVariant, px) {
  const variants = getVariants(stationKey);
  if (!variants.length) return '';
  const colClass = `col-${px}`;
  // New sessions are pre-filled via draftSession from the last saved session.
  // Keep this selector bound to the current draft value only.
  const effectiveVariant = (selectedVariant && variants.includes(selectedVariant)) ? selectedVariant : '';
  const hasSelection = !!effectiveVariant;
  const placeholder = getLang() === 'en' ? '— choose —' : '— scegli —';
  const options = [`<option value="">${placeholder}</option>`]
    .concat(variants.map(v => `<option value="${v}" ${effectiveVariant === v ? 'selected' : ''}>${tVariant(stationKey, v)}</option>`))
    .join('');
  return `<div class="variant-row">
    <div class="variant-select-label">Eserc.</div>
    <select class="variant-select ${hasSelection ? colClass : ''}" data-station="${stationKey}" data-px="${px}" onchange="onVariantChange(this)">
      ${options}
    </select>
  </div>`;
}

function onVariantChange(el) {
  markDraftDirty();
  el.className = `variant-select${el.value ? ' col-' + el.dataset.px : ''}`;
  const stationKey = el.dataset.station;
  const metric = getMetric(stationKey, el.value);
  const exBlock = el.closest('.ex-block');
  if (!exBlock) return;
  const data = getData();
  const s = draftSession || {};
  const prev = getPrevSession(data, currentSess);
  const step = STEPS[currentStep];
  const stationEntry = step.stations.find(st => st.stationKey === stationKey);
  if (!stationEntry) return;
  const exData = s[stationKey] || {};
  const prevExData = prev[stationKey] || {};
  const numSets = metric === 'time' ? MAX_SETS : (step.stations.length <= 2 ? 3 : 2);
  ['ex-time-pr','time-sets','time-total-bar','sets-grid','cluster-hint','difficulty-row'].forEach(cls => {
    exBlock.querySelector('.' + cls)?.remove();
  });
  const frag = document.createElement('div');
  frag.innerHTML = metric === 'time'
    ? timeSetsHTML(stationKey, exData, prevExData, numSets, stationEntry.px)
    : repsSetsHTML(stationKey, exData, prevExData, numSets);
  while (frag.firstChild) exBlock.appendChild(frag.firstChild);
}

// ── TIME SETS HTML ──
function timeSetsHTML(stationKey, exData, prevExData, numSets, px) {
  const holdMax = exData.hold_max ?? '';
  const prevMax = prevExData.hold_max != null ? `prec. ${prevExData.hold_max}"` : '';
  const targetPerSet = holdMax !== '' ? Math.round(Number(holdMax) * 0.65) : null;
  const sets = exData.sets || [];
  const prevSets = prevExData.sets || [];
  const currentTotal = sets.reduce((a, v) => a + (v?.[0] || 0), 0);
  const totalColor = currentTotal >= TIME_TARGET_LOW ? 'var(--teal)' : 'var(--amber)';
  const accentColor = `var(${PAIR_COLORS[px] || '--muted'})`;

  const prBlock = `<div class="ex-time-pr">
    <div class="ex-vc-card">
      <div class="ex-vc-label">Hold max (PR)</div>
      <input class="ex-vc-input" data-pr="${stationKey}" type="number" inputmode="numeric" min="0" placeholder="—" value="${holdMax}" oninput="updateTimeTarget('${stationKey}')">
      <div class="ex-vc-unit">secondi</div>
      ${prevMax ? `<div class="ex-vc-prev">${prevMax}</div>` : ''}
    </div>
    <div class="ex-vc-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <div class="ex-vc-label">Target per set</div>
      <div id="time-target-${stationKey}" class="ex-vc-target-val" style="color:${accentColor}">${targetPerSet ? targetPerSet + '"' : '—'}</div>
      <div class="ex-vc-unit">65% del max</div>
    </div>
  </div>`;

  const setRows = Array.from({length: MAX_SETS}, (_, i) => {
    const rawVal = sets[i]?.[0];
    const prevVal = prevSets[i]?.[0];
    const val = rawVal != null ? rawVal : '';
    const prevDisp = prevVal != null ? `${prevVal}"` : '';
    return `<div class="time-set-row">
      <div class="time-set-label">S${i+1}</div>
      <div class="stepper-row" style="flex:1">
        <button class="stepper-btn" onclick="stepperTimeChange('${stationKey}',${i},-1)">−</button>
        <input class="time-set-input stepper-input" data-ex="${stationKey}" data-set="${i}" type="number" inputmode="numeric" min="0" placeholder="—" value="${val}" oninput="updateTimeTotal('${stationKey}')">
        <button class="stepper-btn" onclick="stepperTimeChange('${stationKey}',${i},1)">+</button>
      </div>
      <div class="time-set-unit">"</div>
      <div class="set-prev" style="min-width:32px;text-align:right;font-size:10px;color:var(--muted2);font-family:var(--mono)">${prevDisp ? `↑${prevDisp}` : ''}</div>
    </div>`;
  }).join('');

  return `${prBlock}
  <div class="time-sets">${setRows}</div>
  <div class="time-total-bar">
    <div class="time-total-label">Totale</div>
    <div>
      <span class="time-total-val" id="time-total-${stationKey}" style="color:${totalColor}">${currentTotal}"</span>
      <span class="time-total-target"> / ${TIME_TARGET_LOW}–${TIME_TARGET_HIGH}"</span>
    </div>
  </div>`;
}

function updateTimeTarget(stationKey) {
  markDraftDirty();
  const input = document.querySelector(`[data-pr="${stationKey}"]`);
  const max = parseInt(input?.value) || 0;
  const target = max > 0 ? Math.round(max * 0.65) : null;
  const el = document.getElementById(`time-target-${stationKey}`);
  if (el) el.textContent = target ? target + '"' : '—';
}

function updateTimeTotal(stationKey) {
  markDraftDirty();
  let total = 0;
  for (let i = 0; i < MAX_SETS; i++) {
    total += parseInt(document.querySelector(`.time-set-input[data-ex="${stationKey}"][data-set="${i}"]`)?.value) || 0;
  }
  const el = document.getElementById(`time-total-${stationKey}`);
  if (!el) return;
  el.textContent = total + '"';
  el.style.color = total >= TIME_TARGET_LOW ? 'var(--teal)' : 'var(--amber)';
}

function stepperTimeChange(stationKey, setIdx, delta) {
  markDraftDirty();
  const el = document.querySelector(`.time-set-input[data-ex="${stationKey}"][data-set="${setIdx}"]`);
  if (!el) return;
  el.value = Math.max(0, (parseInt(el.value) || 0) + delta);
  updateTimeTotal(stationKey);
}

// ── INTENSITY LABEL ──
function getIntensityZone(val) {
  return getIntensityZoneWithDifficulty(val, DEFAULT_DIFFICULTY_KEY);
}

function getIntensityZoneWithDifficulty(avgReps, difficultyKey) {
  if (avgReps == null || avgReps === '' || avgReps === 0) return null;

  const reps = Number(avgReps);
  const diff = difficultyKey || DEFAULT_DIFFICULTY_KEY;

  // La difficoltà non deve aumentare le reps equivalenti.
  // Serve invece a qualificare lo stimolo dentro il range di reps.
  if (diff === 'facile') {
    return { css: 'intensity-mista', label: 'tecnica / volume leggero' };
  }

  if (reps <= 5) {
    return diff === 'limite'
      ? { css: 'intensity-forza', label: 'forza massimale' }
      : { css: 'intensity-forza', label: 'forza' };
  }

  if (reps <= 8) {
    return (diff === 'difficile' || diff === 'limite')
      ? { css: 'intensity-forza', label: 'forza / ipertrofia' }
      : { css: 'intensity-ipertrofia', label: 'ipertrofia' };
  }

  if (reps <= 15) {
    return diff === 'limite'
      ? { css: 'intensity-ipertrofia', label: 'ipertrofia alta' }
      : { css: 'intensity-ipertrofia', label: 'ipertrofia' };
  }

  if (reps <= 30) {
    return (diff === 'difficile' || diff === 'limite')
      ? { css: 'intensity-mista', label: 'ipertrofia / resistenza' }
      : { css: 'intensity-resistenza', label: 'resistenza / volume' };
  }

  return (diff === 'difficile' || diff === 'limite')
    ? { css: 'intensity-resistenza', label: 'resistenza muscolare' }
    : { css: 'intensity-resistenza', label: 'resistenza' };
}

function getStationDifficulty(stationKey) {
  return document.querySelector(`.difficulty-btn[data-ex="${stationKey}"].active`)?.dataset.level || DEFAULT_DIFFICULTY_KEY;
}

function getRepsAvgFromSets(sets, minSets = 3) {
  if (!Array.isArray(sets)) return null;
  let total = 0;
  sets.forEach(([f, c]) => {
    total += (f || 0) + (c || 0);
  });
  if (total <= 0) return null;
  const divisor = Math.max(minSets || 0, 1);
  return Math.round((total / divisor) * 10) / 10;
}

function intensityLabel(val, difficultyKey = DEFAULT_DIFFICULTY_KEY) {
  const zone = getIntensityZoneWithDifficulty(val, difficultyKey);
  if (!zone) return '';
  return `<div class="intensity-lbl ${zone.css}">${zone.label}</div>`;
}
function intensityLabelAvg(stationKey, numSets) {
  let total = 0, count = 0;
  for (let i = 0; i < numSets; i++) {
    const f = parseInt(document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="f"]`)?.value) || 0;
    const c = parseInt(document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="c"]`)?.value) || 0;
    const rep = f + c;
    if (rep > 0) { total += rep; count++; }
  }
  if (!count) return '';
  return intensityLabel(Math.round(total / count), getStationDifficulty(stationKey)).replace('</div>', ' (media)</div>');
}

// ── REPS SETS HTML ──
function repsSetsHTML(stationKey, exData, prevExData, numSets) {
  const sets = exData.sets || [];
  const prevSets = prevExData.sets || [];
  const selectedDifficulty = exData.difficulty || DEFAULT_DIFFICULTY_KEY;
  const renderedSets = [];
  const setRows = Array.from({length: numSets}, (_, i) => {
    const rawF = sets[i]?.[0];
    const rawC = sets[i]?.[1];
    const pf = prevSets[i]?.[0];
    const pc = prevSets[i]?.[1];
    const f = rawF != null ? rawF : '';
    const c = rawC != null ? rawC : '';
    const fVal = f !== '' ? Number(f) : 0;
    const cVal = c !== '' ? Number(c) : 0;
    const rep = fVal + cVal;
    renderedSets.push([fVal || null, cVal || null]);
    const iLbl = intensityLabel(rep > 0 ? rep : null, selectedDifficulty);
    return `<div class="set-row" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="set-main">
        <div class="set-label">S${i+1}</div>
        <div class="set-controls">
          <div class="si-wrap">
            <div class="si-lbl">reps</div>
            <div class="stepper-row">
              <button class="stepper-btn" onclick="stepperChange('${stationKey}',${i},'f',-1)">−</button>
              <input class="stepper-input reps" data-ex="${stationKey}" data-set="${i}" data-type="f" type="number" inputmode="numeric" min="0" placeholder="—" value="${f}" oninput="updateRepsIntensity('${stationKey}',${i},${numSets})">
              <button class="stepper-btn" onclick="stepperChange('${stationKey}',${i},'f',1)">+</button>
            </div>
          </div>
          <div class="si-wrap">
            <div class="si-lbl">cluster</div>
            <div class="stepper-row">
              <button class="stepper-btn" onclick="stepperChange('${stationKey}',${i},'c',-1)">−</button>
              <input class="stepper-input cluster" data-ex="${stationKey}" data-set="${i}" data-type="c" type="number" inputmode="numeric" min="0" placeholder="—" value="${c}" oninput="updateRepsIntensity('${stationKey}',${i},${numSets})">
              <button class="stepper-btn" onclick="stepperChange('${stationKey}',${i},'c',1)">+</button>
            </div>
          </div>
        </div>
        <div id="intensity-f-${stationKey}-${i}">${iLbl}</div>
      </div>
    </div>`;
  }).join('');
  const difficultyHTML = difficultySelectorHTML(stationKey, exData, prevExData);
  const initialAvg = getRepsAvgFromSets(renderedSets, numSets);
  const initialAvgZone = getIntensityZoneWithDifficulty(initialAvg, selectedDifficulty);
  return `<div class="sets-grid" id="sets-grid-${stationKey}">${setRows}</div>
  <div class="cluster-hint">cluster dopo 5"–8" di riposo</div>
  ${difficultyHTML}
  <div class="time-total-bar">
    <div class="time-total-label">Media set</div>
    <div id="reps-avg-${stationKey}" style="font-family:var(--mono);font-size:12px;color:var(--muted)">${initialAvg != null ? `<span class="intensity-lbl ${initialAvgZone?.css || ''}" style="font-size:11px">${initialAvg} rep/set → ${initialAvgZone?.label || ''}</span>` : '—'}</div>
  </div>`;
}

function stepperChange(stationKey, setIdx, type, delta) {
  markDraftDirty();
  const el = document.querySelector(`[data-ex="${stationKey}"][data-set="${setIdx}"][data-type="${type}"]`);
  if (!el) return;
  const cur = parseInt(el.value) || 0;
  el.value = Math.max(0, cur + delta);
  updateRepsIntensity(stationKey, setIdx, document.querySelectorAll(`[data-ex="${stationKey}"][data-type="f"]`).length || 3);
}

function updateRepsIntensity(stationKey, setIdx, numSets) {
  markDraftDirty();
  const fi = document.querySelector(`[data-ex="${stationKey}"][data-set="${setIdx}"][data-type="f"]`);
  const ci = document.querySelector(`[data-ex="${stationKey}"][data-set="${setIdx}"][data-type="c"]`);
  const rep = (parseInt(fi?.value) || 0) + (parseInt(ci?.value) || 0);
  const lbl = document.getElementById(`intensity-f-${stationKey}-${setIdx}`);
  const difficultyKey = getStationDifficulty(stationKey);
  if (lbl) lbl.innerHTML = intensityLabel(rep > 0 ? rep : null, difficultyKey);
  // update average: include cluster in total, divide by the planned/minimum number of main sets
  let total = 0;
  for (let i = 0; i < numSets; i++) {
    const f2 = parseInt(document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="f"]`)?.value) || 0;
    const c2 = parseInt(document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="c"]`)?.value) || 0;
    total += f2 + c2;
  }
  const avg = total > 0 ? Math.round((total / Math.max(numSets, 1)) * 10) / 10 : null;
  const avgEl = document.getElementById(`reps-avg-${stationKey}`);
  if (avgEl) {
    const zone = getIntensityZoneWithDifficulty(avg, difficultyKey);
    avgEl.innerHTML = avg != null
      ? `<span class="intensity-lbl ${zone?.css || ''}" style="font-size:11px">${avg} rep/set → ${zone?.label || ''}</span>`
      : '—';
  }
}

function difficultySelectorHTML(stationKey, exData, prevExData) {
  const selected = exData.difficulty || DEFAULT_DIFFICULTY_KEY;
  const options = DIFFICULTY_LEVELS.map(level =>
    `<button type="button" class="difficulty-btn ${selected === level.key ? 'active' : ''}" data-ex="${stationKey}" data-level="${level.key}" title="${level.title}" onclick="setDifficulty('${stationKey}','${level.key}',this)">${level.emoji}</button>`
  ).join('');
  return `<div class="difficulty-row">
    <div class="difficulty-label">Come ti senti?</div>
    <div class="difficulty-options">${options}</div>
  </div>`;
}

function setDifficulty(stationKey, level, btn) {
  markDraftDirty();
  const parent = btn?.closest('.difficulty-options');
  if (!parent) return;
  parent.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const numSets = document.querySelectorAll(`[data-ex="${stationKey}"][data-type="f"]`).length;
  for (let i = 0; i < numSets; i++) updateRepsIntensity(stationKey, i, numSets);
}

// ── PAIR STEP RENDER ──
function renderPairStep(stepIdx, s, prev) {
  const step = STEPS[stepIdx];
  const color = pairColor(step.px);
  // numSets: time stations always MAX_SETS, reps stations 3
  const numSets = 3;

  const exHTML = step.stations.map(({stationKey, px}) => {
    const exData = s[stationKey] || {};
    const prevExData = prev[stationKey] || {};
    const effectiveVariant = exData.variant || prevExData.variant || '';
    const metric = getMetric(stationKey, effectiveVariant);
    const varHTML = variantSelectHTML(stationKey, exData.variant || '', prevExData.variant || '', px);
    const setsHTML = metric === 'time'
      ? timeSetsHTML(stationKey, exData, prevExData, MAX_SETS, px)
      : repsSetsHTML(stationKey, exData, prevExData, numSets);

    return `<div class="ex-block">
      <div class="ex-head">
        <div class="ex-color-dot" style="background:${pairColor(px)}"></div>
        <div class="ex-name">${getGroupLabel(stationKey)}</div>
      </div>
      ${varHTML}
      ${setsHTML}
    </div>`;
  }).join('');

  const hasTimeEx = step.stations.some(({stationKey}) => {
    const exData = s[stationKey] || {};
    return getMetric(stationKey, exData.variant || '') === 'time';
  });
  const setsLabel = hasTimeEx ? MAX_SETS : numSets;

  document.getElementById('step-content').innerHTML = `
    <div class="pair-header">
      <div class="pair-dot" style="background:${color}"></div>
      <div class="pair-title" style="color:${color}">${step.px.toUpperCase()}</div>
      <div class="pair-sub">${setsLabel} set · 30"</div>
    </div>
    ${exHTML}
  `;
}

// ── COLLECT ──
// collectStep reads the current form state and returns it as an object.
// It only writes to localStorage if the session already has a date (i.e. was explicitly saved).
function collectStep(stepIdx) {
  if (!STEPS.length) return;
  if (!draftSession) draftSession = {};
  const s = draftSession;
  const step = STEPS[stepIdx];

  step.stations.forEach(({stationKey}) => {
    if (!s[stationKey]) s[stationKey] = {};
    const exObj = s[stationKey];
    const selVariant = document.querySelector(`.variant-select[data-station="${stationKey}"]`);
    if (selVariant?.value) exObj.variant = selVariant.value;
    else delete exObj.variant;
    const metric = getMetric(stationKey, exObj.variant || '');
    const sets = [];
    if (metric === 'time') {
      const prInput = document.querySelector(`[data-pr="${stationKey}"]`);
      if (prInput?.value !== '') exObj.hold_max = parseInt(prInput.value) || 0;
      else delete exObj.hold_max;
      delete exObj.difficulty;
      for (let i = 0; i < MAX_SETS; i++) {
        const ti = document.querySelector(`.time-set-input[data-ex="${stationKey}"][data-set="${i}"]`);
        sets.push([ti?.value !== '' ? parseInt(ti.value) : null, null]);
      }
    } else {
      const diffBtn = document.querySelector(`.difficulty-btn[data-ex="${stationKey}"].active`);
      exObj.difficulty = diffBtn?.dataset.level || DEFAULT_DIFFICULTY_KEY;
      const numSets = document.querySelectorAll(`[data-ex="${stationKey}"][data-type="f"]`).length || 3;
      for (let i = 0; i < numSets; i++) {
        const fi = document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="f"]`);
        const ci = document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="c"]`);
        sets.push([fi?.value !== '' ? parseInt(fi.value) : null, ci?.value !== '' ? parseInt(ci.value) : null]);
      }
    }
    exObj.sets = sets;
  });
}

function saveSession() {
  collectStep(currentStep);
  const data = getData();
  if (!draftSession) draftSession = {};
  if (!editingSession || !draftSession.date) {
    draftSession.date = new Date().toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'2-digit' });
  }
  data[currentSess] = cloneObj(draftSession);
  saveData(data);
  draftDirty = false;
  editingSession = false;
  renderSessBar();
  const toast = document.getElementById('toast');
  toast.textContent = '✓ Sessione salvata';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
  renderHistory();
  renderProgress();
}

// ── HISTORY ──
function variantArrow(stationKey, currentVariant, prevVariant) {
  if (!currentVariant || !prevVariant || currentVariant === prevVariant) return '';
  const variants = getGroupVariants(stationKey);
  const ci = variants.indexOf(currentVariant);
  const pi = variants.indexOf(prevVariant);
  if (ci === -1 || pi === -1) return '';
  return ci > pi
    ? `<span class="delta-pos" style="font-size:11px">↑</span>`
    : `<span class="delta-neg" style="font-size:11px">↓</span>`;
}

function renderHistory() {
  const data = getData();
  const list = document.getElementById('history-list');
  const sessions = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a,b) => b-a);
  if (!sessions.length) { list.innerHTML = '<div class="history-empty">Nessuna sessione ancora.</div>'; return; }

  function delta(val, prevVal, invertPositive) {
    if (val == null || prevVal == null) return '';
    const d = val - prevVal;
    if (d === 0) return '';
    const better = invertPositive ? d < 0 : d > 0;
    return `<span class="${better ? 'delta-pos' : 'delta-neg'}">${d > 0 ? '+' : ''}${d}</span>`;
  }

  list.innerHTML = sessions.map(n => {
    const s = data[n], prev = data[n-1] || {};
    const rows = [];

    STEPS.forEach(step => {
      const groupRows = [];
      step.stations.forEach(({stationKey}) => {
        const exObj = s[stationKey], prevExObj = prev[stationKey];
        if (!exObj?.sets) return;
        const metric = getMetric(stationKey, exObj.variant || '');
        const sameVariant = exObj.variant === prevExObj?.variant;
        const arrow = variantArrow(stationKey, exObj.variant, prevExObj?.variant);
        const vLabel = exObj.variant ? ` (${tVariant(stationKey, exObj.variant)})` : '';

        if (metric === 'time') {
          const tot = exObj.sets.reduce((a,[t]) => a+(t||0), 0);
          const prevTot = sameVariant ? prevExObj?.sets?.reduce((a,[t]) => a+(t||0), 0) ?? null : null;
          const prevPR = sameVariant ? prevExObj?.hold_max ?? null : null;
          if (exObj.hold_max != null || tot > 0) {
            groupRows.push(`<div class="history-row">
              <span class="history-key">${getGroupLabel(stationKey)}${vLabel} ${arrow}</span>
              <span class="history-val">
                ${exObj.hold_max != null ? `<span><span style="color:var(--muted);font-size:10px">max </span>${exObj.hold_max}" ${delta(exObj.hold_max, prevPR, false)}</span>` : ''}
                ${tot > 0 ? `<span><span style="color:var(--muted);font-size:10px">tot </span>${tot}" ${delta(tot, prevTot, false)}</span>` : ''}
              </span>
            </div>`);
          }
        } else {
          const tot = exObj.sets.reduce((a,[f,c]) => a+(f||0)+(c||0), 0);
          const cl = exObj.sets.reduce((a,[f,c]) => a+(c||0), 0);
          const avg = getRepsAvgFromSets(exObj.sets);
          const avgZone = getIntensityZoneWithDifficulty(avg, exObj.difficulty || DEFAULT_DIFFICULTY_KEY);
          const prevTot = sameVariant ? prevExObj?.sets?.reduce((a,[f,c]) => a+(f||0)+(c||0), 0) ?? null : null;
          const prevCl = sameVariant ? prevExObj?.sets?.reduce((a,[f,c]) => a+(c||0), 0) ?? null : null;
          groupRows.push(`<div class="history-row">
            <span class="history-key">${getGroupLabel(stationKey)}${vLabel} ${arrow}</span>
            <span class="history-val">${tot} rep ${delta(tot, prevTot, false)} ${avgZone ? `<span class="intensity-lbl ${avgZone.css}" style="font-size:10px">${avgZone.label}</span>` : ''}</span>
          </div>`);
          if (cl > 0 || (prevCl != null && prevCl > 0)) {
            groupRows.push(`<div class="history-row">
              <span class="history-key">${getGroupLabel(stationKey)} cluster</span>
              <span class="history-val">${cl} ${delta(cl, prevCl, true)}</span>
            </div>`);
          }
        }
      });
      if (groupRows.length) {
        const pColor = pairColor(step.px);
        rows.push(`<div class="history-pair-header" style="color:${pColor}">${step.px.toUpperCase()} — ${step.label}</div>`);
        rows.push(...groupRows);
      }
    });

    return `<div class="history-sess">
      <div class="history-head" onclick="toggleHistory(this)">
        <span class="history-sess-num">Sessione ${n}</span>
        <div class="history-meta">
          <span class="history-date">${s.date||'—'}</span>
          <button class="delete-btn" style="color:var(--blue);border-color:var(--blue)" onclick="editSessionFromHistory(event,${n})">✎</button>
          <button class="delete-btn" onclick="deleteSession(event,${n})">✕</button>
        </div>
      </div>
      <div class="history-body">${rows.join('')||'<div style="font-size:12px;color:var(--muted);padding:4px 0">Nessun dato</div>'}</div>
    </div>`;
  }).join('');
}

function toggleHistory(el) { el.nextElementSibling.classList.toggle('open'); }
function deleteSession(e, n) {
  e.stopPropagation();
  if (!confirm(`Cancellare la sessione ${n}?`)) return;
  const data = getData();
  delete data[n];
  saveData(data);

  // Se si elimina la sessione che era in modifica, oppure si eliminano tutte,
  // lo stato di inserimento deve tornare coerente senza richiedere refresh.
  const remainingNums = Object.keys(data).map(Number).filter(x => !isNaN(x));
  if (editingSession && currentSess === n) {
    resetDraftSession();
    renderSessBar();
    renderStepDots();
    renderStep();
  } else if (!remainingNums.length && !editingSession) {
    resetDraftSession();
    renderSessBar();
    renderStepDots();
    renderStep();
  }

  renderHistory();
  renderProgress();
}
function editSessionFromHistory(e, n) {
  e.stopPropagation();
  if (draftDirty && !confirm('La sessione corrente non è salvata. Aprire questa sessione e perdere i dati inseriti?')) return;
  const data = getData();
  currentSess = n;
  currentStep = 0;
  editingSession = true;
  draftSession = cloneObj(data[n] || {});
  draftDirty = false;
  _suppressTabGuard = true;
  switchTab('log');
  _suppressTabGuard = false;
  renderSessBar();
  renderStepDots();
  renderStep();
}


// ── PROGRESS ──
function renderProgress() {
  const data = getData();
  const sessions = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a,b) => a-b);
  const cont = document.getElementById('progress-content');
  if (sessions.length < 2) { cont.innerHTML = '<div class="history-empty">Inserisci almeno 2 sessioni<br>per vedere i progressi.</div>'; return; }

  function chartHTML(title, color, valFn, invertTrend, variantFn, stationKeyForArrow) {
    const vals = sessions.map(n => valFn(data[n]));
    const variants = variantFn ? sessions.map(n => variantFn(data[n])) : null;
    if (vals.every(v => v == null)) return '';
    const defined = vals.filter(v => v != null);
    const maxV = Math.max(...defined), minV = Math.min(...defined);
    // trend: only sessions with same variant as last
    const lastVariant = variants ? [...variants].reverse().find(v => v != null) : null;
    const sameVals = variants
      ? sessions.map((n,i) => variants[i] === lastVariant && vals[i] != null ? vals[i] : null).filter(v => v != null)
      : defined;
    const tFirst = sameVals[0] ?? defined[0];
    const tLast = sameVals[sameVals.length-1] ?? defined[defined.length-1];
    const trend = tLast - tFirst;
    const tLabel = sameVals.length < 2 ? '—' : (trend === 0 ? '=' : (trend > 0 ? '+'+trend : ''+trend));
    const tColor = sameVals.length < 2 ? 'var(--muted)' :
      trend === 0 ? 'var(--muted)' :
      (invertTrend ? (trend < 0 ? 'var(--teal)' : 'var(--coral)') : (trend > 0 ? 'var(--teal)' : 'var(--coral)'));

    const bars = sessions.map((n,i) => {
      const v = vals[i];
      if (v == null) return `<div class="prog-bar" style="background:var(--border);height:4px"><div class="prog-bar-label">S${n}</div></div>`;
      const h = maxV === minV ? 50 : ((v - minV) / (maxV - minV)) * 60 + 10;
      const variantChanged = stationKeyForArrow && variants && i > 0
        && variants[i] != null && variants[i-1] != null && variants[i] !== variants[i-1];
      let arrowLabel = `${v}`, valColor = color;
      if (variantChanged) {
        const allVars = getGroupVariants(stationKeyForArrow);
        const ci = allVars.indexOf(variants[i]);
        const pi = allVars.indexOf(variants[i-1]);
        const isAdvance = ci > pi;
        arrowLabel = (isAdvance ? '↑' : '↓') + v;
        valColor = isAdvance ? 'var(--purple)' : 'var(--coral)';
      }
      return `<div class="prog-bar" style="background:${color};height:${h}px"><div class="prog-val" style="color:${valColor}">${arrowLabel}</div><div class="prog-bar-label">S${n}</div></div>`;
    }).join('');

    const currentVariant = lastVariant
      ? `<span style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-left:6px">${stationKeyForArrow ? tVariant(stationKeyForArrow, lastVariant) : lastVariant}</span>`
      : '';

    return `<div class="prog-section">
      <div class="prog-title">${title}${currentVariant}</div>
      <div class="prog-chart-wrap"><div class="prog-chart">${bars}</div></div>
      <div class="prog-stat-row">
        <div class="prog-stat"><div class="prog-stat-val" style="color:${color}">${defined[0]}</div><div class="prog-stat-lbl">inizio</div></div>
        <div class="prog-stat"><div class="prog-stat-val" style="color:${color}">${defined[defined.length-1]}</div><div class="prog-stat-lbl">attuale</div></div>
        <div class="prog-stat"><div class="prog-stat-val" style="color:${tColor}">${tLabel}</div><div class="prog-stat-lbl">trend</div></div>
      </div>
    </div>`;
  }

  function clPct(s, stationKey) {
    const e = s[stationKey]; if (!e?.sets) return null;
    const tot = e.sets.reduce((a,[f,c]) => a+(f||0)+(c||0), 0);
    const cl = e.sets.reduce((a,[f,c]) => a+(c||0), 0);
    return tot > 0 ? Math.round(cl/tot*100) : null;
  }

  function stationVal(s, stationKey) {
    const e = s[stationKey]; if (!e?.sets) return null;
    const metric = getMetric(stationKey, e.variant || '');
    if (metric === 'time') {
      const tot = e.sets.reduce((a,[t]) => a+(t||0), 0);
      return tot > 0 ? tot : null;
    }
    const tot = e.sets.reduce((a,[f,c]) => a+(f||0)+(c||0), 0);
    return tot > 0 ? tot : null;
  }

  function stationPR(s, stationKey) {
    return s[stationKey]?.hold_max ?? null;
  }

  const sections = STEPS.map(step => {
    const color = pairColor(step.px);
    const charts = [];
    step.stations.forEach(({stationKey}) => {
      const label = getGroupLabel(stationKey);
      // Determine metric: use last known variant, fallback to group default
      const lastKnownVariant = [...sessions].reverse().map(n => getData()[n]?.[stationKey]?.variant).find(v => v) || '';
      const metric = getMetric(stationKey, lastKnownVariant);
      if (metric === 'time') {
        charts.push(chartHTML(`${label} — PR`, color, s => stationPR(s, stationKey), false, s => s[stationKey]?.variant ?? null, stationKey));
        charts.push(chartHTML(`${label} — tot.`, color, s => stationVal(s, stationKey), false, s => s[stationKey]?.variant ?? null, stationKey));
      } else {
        charts.push(chartHTML(`${label} — rep`, color, s => stationVal(s, stationKey), false, s => s[stationKey]?.variant ?? null, stationKey));
      }
    });
    const rendered = charts.filter(Boolean);
    if (!rendered.length) return '';
    return `<div class="prog-pair-header" style="color:${color}">${step.px.toUpperCase()} — ${step.label}</div>` + rendered.join('');
  }).filter(Boolean);

  cont.innerHTML = sections.join('') || '<div class="history-empty">Dati insufficienti.</div>';
}

// ── LANGUAGE ──
async function toggleLang() {
  const next = getLang() === 'it' ? 'en' : 'it';
  localStorage.setItem(KEY_LANG, next);
  document.getElementById('lang-badge').textContent = next.toUpperCase();
  // Preserva i valori del form corrente prima del re-render
  collectStep(currentStep);
  await loadExercises();
  renderStepDots();
  renderStep();
  renderHistory();
  renderProgress();
}

// ── USER MENU ──
function toggleUserMenu() {
  const menu = document.getElementById('user-menu');
  menu.classList.toggle('open');
  if (menu.classList.contains('open')) {
    setTimeout(() => document.addEventListener('click', closeUserMenuOutside, { once: true }), 0);
  }
}
function closeUserMenuOutside(e) {
  const wrap = document.querySelector('.user-menu-wrap');
  if (!wrap.contains(e.target)) document.getElementById('user-menu').classList.remove('open');
}
function closeUserMenu() { document.getElementById('user-menu').classList.remove('open'); }

// ── NAME MODAL ──
function openNameModal() { document.getElementById('name-modal').classList.add('open'); setTimeout(() => document.getElementById('name-input').focus(), 100); }
function saveName() {
  const v = document.getElementById('name-input').value.trim();
  if (!v) return;
  localStorage.setItem(KEY_NAME, v);
  document.getElementById('name-badge').textContent = v;
  document.getElementById('name-modal').classList.remove('open');
  resetDraftSession();
  renderStepDots(); renderStep(); renderHistory(); renderProgress();
}
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });

// ── RENAME ──
function openRenameModal() {
  closeUserMenu();
  const current = getName();
  document.getElementById('rename-input').value = current;
  const hasData = Object.keys(getData()).some(k => !isNaN(Number(k)));
  const count = Object.keys(getData()).filter(k => !isNaN(Number(k))).length;
  document.getElementById('rename-hint').textContent = hasData
    ? `Hai ${count} sessioni salvate come "${current}".`
    : `Nessun dato salvato come "${current}".`;
  document.getElementById('rename-btn-carry').style.display = hasData ? '' : 'none';
  document.getElementById('rename-modal').classList.add('open');
  setTimeout(() => document.getElementById('rename-input').focus(), 100);
}
function saveRename(carryData) {
  const newName = document.getElementById('rename-input').value.trim();
  if (!newName) return;
  const oldName = getName();
  if (newName !== oldName && carryData) {
    const oldData = getData();
    const newKey = 'cali_sessions_' + newName.toLowerCase().replace(/\s+/g,'_');
    localStorage.setItem(newKey, JSON.stringify(oldData));
    localStorage.removeItem('cali_sessions_' + oldName.toLowerCase().replace(/\s+/g,'_'));
  }
  localStorage.setItem(KEY_NAME, newName);
  document.getElementById('name-badge').textContent = newName;
  document.getElementById('rename-modal').classList.remove('open');
  resetDraftSession();
  renderStepDots(); renderStep(); renderHistory(); renderProgress();
}
document.getElementById('rename-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveRename(true); });

// ── EXPORT ──
function exportData() {
  closeUserMenu();
  const name = getName();
  const payload = { name, sessions: getData(), exported: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cali-tracker-${name.toLowerCase().replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── IMPORT ──
let _importPayload = null;
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const payload = JSON.parse(ev.target.result);
      if (!payload.sessions || typeof payload.sessions !== 'object') throw new Error('Formato non valido');
      _importPayload = payload;
      const count = Object.keys(payload.sessions).filter(k => !isNaN(Number(k))).length;
      const exported = payload.exported ? new Date(payload.exported).toLocaleDateString('it-IT') : '—';
      document.getElementById('import-modal-body').innerHTML =
        `File: <b>${file.name}</b><br>Utente: <b>${payload.name || '—'}</b><br>Sessioni: <b>${count}</b><br>Esportato il: <b>${exported}</b><br><br>` +
        `Verranno importati come <b>${getName()}</b>.<br><span style="color:var(--coral)">I dati esistenti verranno sovrascritti.</span>`;
      document.getElementById('import-confirm-btn').onclick = confirmImport;
      document.getElementById('import-modal').classList.add('open');
    } catch(err) { alert('File non valido: ' + err.message); }
  };
  reader.readAsText(file);
}
function confirmImport() {
  if (!_importPayload) return;
  // Gli export pre-3.0.0 contengono i vecchi nomi variante
  saveData(migrateAllSessions(_importPayload.sessions));
  _importPayload = null;
  document.getElementById('import-modal').classList.remove('open');
  resetDraftSession();
  renderStepDots(); renderStep(); renderHistory(); renderProgress();
  const toast = document.getElementById('toast');
  toast.textContent = '✓ Dati importati';
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); toast.textContent = '✓ Sessione salvata'; }, 2500);
}

// ── TABS ──
function activateTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', ['log','history','progress'][i] === t));
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  if (t === 'history') renderHistory();
  if (t === 'progress') renderProgress();
}

function switchTab(t) {
  const activeTab = ['log','history','progress'][Array.from(document.querySelectorAll('.tab')).findIndex(el => el.classList.contains('active'))] || 'log';

  if (!_suppressTabGuard && activeTab === 'log' && t !== 'log' && draftDirty) {
    const ok = confirm('La sessione corrente non è salvata. Uscendo da Inserisci i dati inseriti verranno persi. Continuare?');
    if (!ok) return;
    resetDraftSession();
    renderSessBar();
    renderStepDots();
    renderStep();
  }

  if (t === 'log' && activeTab !== 'log' && !_suppressTabGuard) {
    resetDraftSession();
    renderSessBar();
    renderStepDots();
    renderStep();
  }

  activateTab(t);
}


// ── SWIPE ──
(function() {
  let startX = 0, startY = 0;
  const el = document.getElementById('page-log');
  el.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0) goStep(1);
    else goStep(-1);
  }, { passive: true });
})();

// ── TEMP STATE — persist unsaved form data across SW-triggered reloads ──
const TEMP_KEY = 'cali_temp_state';

function saveTempState() {
  // Preserve unsaved draft only in sessionStorage during an app/service-worker reload.
  if (!STEPS.length) return;
  collectStep(currentStep);
  sessionStorage.setItem(TEMP_KEY, JSON.stringify({
    sess: currentSess,
    step: currentStep,
    editing: editingSession,
    dirty: draftDirty,
    draft: draftSession || {}
  }));
}


function restoreTempState() {
  try {
    const raw = sessionStorage.getItem(TEMP_KEY);
    if (!raw) return false;
    sessionStorage.removeItem(TEMP_KEY);
    const state = JSON.parse(raw);
    currentSess = state.sess;
    currentStep = state.step;
    editingSession = state.editing || false;
    draftDirty = state.dirty || false;
    // Il draft può arrivare da un reload pre-aggiornamento con i vecchi nomi
    draftSession = migrateSessionVariants(cloneObj(state.draft || {}));
    return true;
  } catch(e) { return false; }
}


let _tempFormRestore = null;

// ── SERVICE WORKER ──
const SW_POLL_INTERVAL = 15 * 60 * 1000;

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    window._swReg = reg;
    // Poll the server for a new sw.js: a changed CACHE_VERSION triggers
    // install → activate → SW_UPDATED → reload
    setInterval(() => reg.update(), SW_POLL_INTERVAL);
  });

  // Check for updates whenever the app comes back to the foreground
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && window._swReg) window._swReg.update();
  });

  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'SW_UPDATED') {
      saveTempState();
      window.location.reload();
    }
  });
}

init();
