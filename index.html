<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cali Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0c;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #272727;
  --border2: #333;
  --text: #eeebe6;
  --muted: #7a7672;
  --muted2: #444;
  --accent: #c8f060;
  --accent2: #8fb840;
  --teal: #4dd9a0;
  --coral: #f07060;
  --amber: #f0b840;
  --purple: #b090f0;
  --blue: #60a8f0;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 10px;
  /* pair colors */
  --p0: #b090f0;
  --p1: #ee412a;
  --p2: #47d2eb;
  --p3: #df60f0;
  --p4: #f09138;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; max-width: 480px; margin: 0 auto; }

.app-header { padding: 18px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.app-title { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }

/* USER MENU */
.user-menu-wrap { position: relative; }
.name-badge { font-size: 12px; color: var(--muted); font-family: var(--mono); cursor: pointer; border: 1px solid var(--border2); border-radius: 20px; padding: 4px 10px; user-select: none; }
.user-menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r); min-width: 160px; z-index: 50; overflow: hidden; display: none; }
.user-menu.open { display: block; }
.user-menu-item { padding: 11px 14px; font-size: 13px; font-family: var(--sans); color: var(--text); cursor: pointer; border-bottom: 1px solid var(--border); }
.user-menu-item:last-child { border-bottom: none; }
.user-menu-item:active { background: var(--surface2); }

.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.page { display: none; }
.page.active { display: block; }

/* SESSION BAR */
.sess-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sess-info { display: flex; align-items: baseline; gap: 8px; }
.sess-num-big { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--accent); }
.sess-date-sm { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sess-nav { display: flex; gap: 6px; }
.sess-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.sess-btn:active { background: var(--surface2); }

/* STEP */
.step-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 0; }
.step-label { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.step-dots { display: flex; gap: 5px; }
.step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); transition: background .2s; }
.step-dot.active { background: var(--accent); }
.step-dot.done { background: var(--muted2); }

.step-nav { display: flex; align-items: center; padding: 10px 16px 14px; gap: 10px; }
.nav-btn { flex: 1; padding: 11px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); border-radius: var(--r); font-size: 13px; font-family: var(--sans); cursor: pointer; }
.nav-btn:active { background: var(--surface2); }
.nav-btn:disabled { opacity: .3; cursor: default; }
.save-btn { flex: 2; padding: 11px; background: var(--accent); color: #0c0c0c; border: none; border-radius: var(--r); font-size: 14px; font-weight: 600; font-family: var(--sans); cursor: pointer; }
.save-btn:active { background: var(--accent2); }

.step-content { padding: 14px 16px 0; }

/* VARIANT SELECT */
.variant-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.variant-select-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
.variant-select { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: var(--sans); color: var(--text); cursor: pointer; appearance: none; -webkit-appearance: none; }
.variant-select:focus { outline: none; }
.variant-select.col-p0 { border-color: var(--p0); color: var(--p0); }
.variant-select.col-p1 { border-color: var(--p1); color: var(--p1); }
.variant-select.col-p2 { border-color: var(--p2); color: var(--p2); }
.variant-select.col-p3 { border-color: var(--p3); color: var(--p3); }
.variant-select.col-p4 { border-color: var(--p4); color: var(--p4); }
.variant-prev-sm { font-size: 10px; color: var(--muted2); font-family: var(--mono); flex-shrink: 0; }

/* PAIR HEADER */
.pair-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.pair-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pair-title { font-size: 14px; font-weight: 600; }
.pair-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: auto; }

/* EX BLOCK */
.ex-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
.ex-head { padding: 9px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.ex-color-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.ex-name { font-size: 12px; font-weight: 500; }

/* TIME BLOCK */
.ex-time-pr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.ex-vc-card { background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 10px; }
.ex-vc-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.ex-vc-input { width: 100%; background: transparent; border: none; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; outline: none; }
.ex-vc-input::-webkit-inner-spin-button, .ex-vc-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.ex-vc-unit { font-size: 10px; color: var(--muted2); font-family: var(--mono); text-align: center; margin-top: 2px; }
.ex-vc-prev { font-size: 10px; color: var(--muted); font-family: var(--mono); text-align: center; margin-top: 2px; }
.ex-vc-target-val { font-size: 22px; font-family: var(--mono); font-weight: 500; text-align: center; }

/* TIME SETS */
.time-sets { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.time-set-row { display: flex; align-items: center; gap: 8px; }
.time-set-label { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; }
.time-set-input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; }
.time-set-input::-webkit-inner-spin-button, .time-set-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.time-set-input:focus { outline: none; border-color: var(--purple); }
.time-set-unit { font-size: 11px; color: var(--muted2); font-family: var(--mono); width: 20px; }
.time-total-bar { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.time-total-label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.time-total-val { font-family: var(--mono); font-size: 14px; font-weight: 500; }
.time-total-target { font-size: 10px; color: var(--muted2); font-family: var(--mono); }

/* REPS SETS */
.sets-grid { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.set-row { display: flex; align-items: center; gap: 8px; }
.set-label { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; }
.set-inputs { display: flex; gap: 6px; flex: 1; }
.si-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.si-lbl { font-size: 9px; color: var(--muted2); font-family: var(--mono); text-align: center; text-transform: uppercase; letter-spacing: .04em; }
.si-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; }
.si-input::-webkit-inner-spin-button, .si-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.si-input.filate:focus { border-color: var(--teal); }
.si-input.cluster:focus { border-color: var(--amber); }
.set-prev { font-family: var(--mono); font-size: 10px; color: var(--muted2); white-space: nowrap; min-width: 44px; text-align: right; }
.cluster-hint { font-size: 10px; color: var(--amber); font-family: var(--mono); text-align: center; padding: 6px 12px 10px; opacity: .7; }

/* HISTORY */
#page-history { padding: 16px; }
.history-empty { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 13px; line-height: 1.9; }
.history-sess { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.history-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.history-sess-num { font-family: var(--mono); font-size: 13px; color: var(--accent); }
.history-meta { display: flex; align-items: center; gap: 10px; }
.history-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.delete-btn { background: none; border: 1px solid var(--border2); border-radius: 6px; color: var(--muted); font-size: 11px; padding: 3px 7px; cursor: pointer; }
.delete-btn:active { background: var(--coral); color: #0c0c0c; border-color: var(--coral); }
.history-body { padding: 10px 14px; display: none; border-top: 1px solid var(--border); }
.history-body.open { display: block; }
.history-pair-header { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 0 4px; border-top: 1px solid var(--border); margin-top: 4px; }
.history-pair-header:first-child { border-top: none; margin-top: 0; }
.history-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.history-row:last-child { border-bottom: none; }
.history-key { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.history-val { font-family: var(--mono); font-weight: 500; font-size: 12px; display: flex; align-items: center; gap: 4px; }
.delta-pos { color: var(--teal); font-size: 10px; }
.delta-neg { color: var(--coral); font-size: 10px; }

/* PROGRESS */
#page-progress { padding: 16px; }
.prog-section { margin-bottom: 24px; }
.prog-title { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.prog-chart-wrap { padding-bottom: 22px; }
.prog-chart { height: 80px; display: flex; align-items: flex-end; gap: 4px; }
.prog-bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 4px; position: relative; }
.prog-bar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); font-family: var(--mono); }
.prog-val { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 9px; font-family: var(--mono); font-weight: 500; white-space: nowrap; }
.prog-stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 6px; }
.prog-stat { background: var(--surface); border-radius: 8px; padding: 10px; text-align: center; }
.prog-stat-val { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.prog-stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
.prog-pair-header { font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; padding: 14px 0 6px; border-top: 1px solid var(--border); margin-top: 4px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
.modal-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; font-size: 16px; color: var(--text); font-family: var(--sans); }
.modal-input:focus { outline: none; border-color: var(--accent); }
.modal-btn { width: 100%; margin-top: 12px; padding: 12px; background: var(--accent); color: #0c0c0c; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); }
.modal-btn-ghost { width: 100%; margin-top: 8px; padding: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; font-size: 14px; cursor: pointer; font-family: var(--sans); }

.toast { text-align: center; font-size: 12px; color: var(--accent); font-family: var(--mono); padding: 8px; opacity: 0; transition: opacity .3s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">Cali Tracker <span id="version" style="color:var(--muted2);font-size:10px;letter-spacing:.04em">v2.5</span></div>
  <div class="user-menu-wrap">
    <div class="name-badge" id="name-badge" onclick="toggleUserMenu()">— imposta nome</div>
    <div class="user-menu" id="user-menu">
      <div class="user-menu-item" onclick="openRenameModal()">✎ Rinomina</div>
      <div class="user-menu-item" onclick="exportData()">↓ Esporta dati</div>
      <div class="user-menu-item" onclick="document.getElementById('import-file').click()">↑ Importa dati</div>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('log')">Inserisci</div>
  <div class="tab" onclick="switchTab('history')">Storico</div>
  <div class="tab" onclick="switchTab('progress')">Progressi</div>
</div>

<div class="page active" id="page-log">
  <div class="sess-bar">
    <div class="sess-info">
      <div class="sess-num-big" id="sess-num">1</div>
      <div class="sess-date-sm" id="sess-date">—</div>
    </div>
    <div class="sess-nav">
      <button class="sess-btn" onclick="changeSess(-1)">‹</button>
      <button class="sess-btn" onclick="changeSess(1)">›</button>
    </div>
  </div>
  <div class="step-bar">
    <div class="step-label" id="step-label"></div>
    <div class="step-dots" id="step-dots"></div>
  </div>
  <div class="step-content" id="step-content"></div>
  <div class="step-nav">
    <button class="nav-btn" id="btn-prev" onclick="goStep(-1)" style="display:none">‹ Indietro</button>
    <button class="nav-btn" id="btn-next" onclick="goStep(1)" style="display:none">Avanti ›</button>
    <button class="save-btn" id="btn-save" onclick="saveSession()" style="display:none">Salva ✓</button>
  </div>
  <div class="toast" id="toast">✓ Sessione salvata</div>
</div>

<div class="page" id="page-history">
  <div id="history-list"><div class="history-empty">Nessuna sessione ancora.</div></div>
</div>

<div class="page" id="page-progress">
  <div id="progress-content"><div class="history-empty">Inserisci almeno 2 sessioni<br>per vedere i progressi.</div></div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="name-modal">
  <div class="modal">
    <div class="modal-title">Come ti chiami?</div>
    <input class="modal-input" id="name-input" type="text" placeholder="Il tuo nome" maxlength="30">
    <button class="modal-btn" onclick="saveName()">Salva</button>
  </div>
</div>

<div class="modal-overlay" id="rename-modal">
  <div class="modal">
    <div class="modal-title">Rinomina utente</div>
    <input class="modal-input" id="rename-input" type="text" placeholder="Nuovo nome" maxlength="30">
    <div id="rename-hint" style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:8px;line-height:1.5"></div>
    <button class="modal-btn" id="rename-btn-carry" onclick="saveRename(true)">Rinomina e porta i dati</button>
    <button class="modal-btn-ghost" onclick="saveRename(false)">Rinomina senza dati</button>
  </div>
</div>

<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <div class="modal-title">Importa dati</div>
    <div id="import-modal-body" style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:4px"></div>
    <button class="modal-btn" id="import-confirm-btn">Conferma importazione</button>
    <button class="modal-btn-ghost" onclick="document.getElementById('import-modal').classList.remove('open')">Annulla</button>
  </div>
</div>

<script>
const VERSION = '2.5';
const KEY_NAME = 'cali_name';
const MAX_SETS = 6;
const TIME_TARGET_LOW = 50;
const TIME_TARGET_HIGH = 60;

function sessKey() { return 'cali_sessions_' + (getName().toLowerCase().replace(/\s+/g,'_') || 'default'); }
function getData() { try { return JSON.parse(localStorage.getItem(sessKey())) || {}; } catch(e) { return {}; } }
function saveData(d) { localStorage.setItem(sessKey(), JSON.stringify(d)); }
function getName() { return localStorage.getItem(KEY_NAME) || ''; }

let currentSess = 1;
let currentStep = 0;
let STEPS = []; // built dynamically from EXERCISES

// ── EXERCISES (loaded from JSON) ──
let EXERCISES = {};

// pair color map
const PAIR_COLORS = { p0:'--p0', p1:'--p1', p2:'--p2', p3:'--p3', p4:'--p4' };
const PAIR_LABELS = {
  p0: 'Handstand',
  p1: 'Tirata verticale + Gambe anteriori',
  p2: 'Spinta orizzontale + Core',
  p3: 'Tirata orizzontale + Gambe posteriori',
  p4: 'Spinta verticale + Catena posteriore'
};

function pairColor(pKey) { return `var(${PAIR_COLORS[pKey] || '--muted'})`; }

// ── BUILD STEPS from EXERCISES ──
// Groups exercises by pX prefix, orders by pX then sY
function buildSteps() {
  const groups = {}; // { p0: [{stationKey:'p0s1', group}, ...], p1: [...], ... }
  Object.entries(EXERCISES).forEach(([groupKey, group]) => {
    const st = group.station; // e.g. "p0s1"
    const m = st.match(/^(p\d+)(s\d+)$/);
    if (!m) return;
    const [, px, sy] = m;
    if (!groups[px]) groups[px] = [];
    groups[px].push({ stationKey: st, px, sy, groupKey, group });
  });
  // sort each pair by sY, then sort pairs by pX
  const sortedPairs = Object.keys(groups).sort();
  STEPS = sortedPairs.map(px => {
    const stations = groups[px].sort((a,b) => a.sy.localeCompare(b.sy));
    return { px, label: PAIR_LABELS[px] || px.toUpperCase(), stations };
  });
}

function getMetric(stationKey, variant) {
  const group = Object.values(EXERCISES).find(g => g.station === stationKey);
  if (!group) return 'reps';
  if (variant) return group.metrics?.[variant] || 'reps';
  // No variant selected: check if ALL variants are time → default to time
  if (group.metrics && group.variants) {
    const allTime = group.variants.every(v => group.metrics[v] === 'time');
    if (allTime) return 'time';
  }
  return 'reps';
}

function getVariants(stationKey) {
  const group = Object.values(EXERCISES).find(g => g.station === stationKey);
  return group?.variants || [];
}

function getGroupLabel(stationKey) {
  const group = Object.values(EXERCISES).find(g => g.station === stationKey);
  return group?.label || stationKey;
}

function getGroupVariants(stationKey) {
  const group = Object.values(EXERCISES).find(g => g.station === stationKey);
  return group?.variants || [];
}

// ── LOAD EXERCISES ──
async function loadExercises() {
  document.getElementById('step-content').innerHTML = '<div style="padding:12px;font-family:var(--mono);font-size:11px;color:var(--muted)">Caricamento…</div>';
  try {
    const res = await fetch('exercises.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    EXERCISES = await res.json();
    buildSteps();
  } catch(e) {
    console.warn('exercises.json fetch failed:', e.message);
    EXERCISES = {};
    STEPS = [];
  }
}

// ── INIT ──
async function init() {
  const name = getName();
  if (!name) openNameModal();
  else document.getElementById('name-badge').textContent = name;
  await loadExercises();
  const data = getData();
  const nums = Object.keys(data).map(Number).filter(n => !isNaN(n));
  if (nums.length) currentSess = Math.max(...nums);
  renderStepDots();
  renderStep();
  renderHistory();
  renderProgress();
  document.getElementById('version').textContent = 'v' + VERSION;
}

// ── SESSION NAV ──
function changeSess(d) {
  collectStep(currentStep);
  const next = currentSess + d;
  if (next < 1 || next > 30) return;
  currentSess = next;
  currentStep = 0;
  renderStepDots();
  renderStep();
}

// ── STEP NAV ──
function renderStepDots() {
  document.getElementById('step-dots').innerHTML = Array.from({length: STEPS.length}, (_, i) => {
    const cls = i === currentStep ? 'active' : i < currentStep ? 'done' : '';
    return `<div class="step-dot ${cls}"></div>`;
  }).join('');
}

function goStep(d) {
  collectStep(currentStep);
  currentStep = Math.max(0, Math.min(STEPS.length - 1, currentStep + d));
  renderStepDots();
  renderStep();
}

function renderStep() {
  if (!STEPS.length) return;
  const step = STEPS[currentStep];
  document.getElementById('step-label').textContent = step.label;
  document.getElementById('btn-prev').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-save').style.display = currentStep === STEPS.length - 1 ? '' : 'none';
  const data = getData();
  const s = data[currentSess] || {};
  const prev = data[currentSess - 1] || {};
  document.getElementById('sess-num').textContent = currentSess;
  document.getElementById('sess-date').textContent = s.date || '—';
  renderPairStep(currentStep, s, prev);
}

// ── VARIANT SELECT ──
function variantSelectHTML(stationKey, selectedVariant, prevVariant, px) {
  const variants = getVariants(stationKey);
  if (!variants.length) return '';
  const colClass = `col-${px}`;
  const hasSelection = selectedVariant && variants.includes(selectedVariant);
  const options = ['<option value="">— scegli —</option>']
    .concat(variants.map(v => `<option value="${v}" ${selectedVariant === v ? 'selected' : ''}>${v}</option>`))
    .join('');
  return `<div class="variant-row">
    <div class="variant-select-label">Eserc.</div>
    <select class="variant-select ${hasSelection ? colClass : ''}" data-station="${stationKey}" data-px="${px}" onchange="onVariantChange(this)">
      ${options}
    </select>
    ${prevVariant ? `<div class="variant-prev-sm">↑${prevVariant}</div>` : ''}
  </div>`;
}

function onVariantChange(el) {
  el.className = `variant-select${el.value ? ' col-' + el.dataset.px : ''}`;
  const stationKey = el.dataset.station;
  const metric = getMetric(stationKey, el.value);
  const exBlock = el.closest('.ex-block');
  if (!exBlock) return;
  const data = getData();
  const s = data[currentSess] || {};
  const prev = data[currentSess - 1] || {};
  const step = STEPS[currentStep];
  const stationEntry = step.stations.find(st => st.stationKey === stationKey);
  if (!stationEntry) return;
  const exData = s[stationKey] || {};
  const prevExData = prev[stationKey] || {};
  const numSets = metric === 'time' ? MAX_SETS : (step.stations.length <= 2 ? 3 : 2);
  ['ex-time-pr','time-sets','time-total-bar','sets-grid','cluster-hint'].forEach(cls => {
    exBlock.querySelector('.' + cls)?.remove();
  });
  const frag = document.createElement('div');
  frag.innerHTML = metric === 'time'
    ? timeSetsHTML(stationKey, exData, prevExData, numSets, stationEntry.px)
    : repsSetsHTML(stationKey, exData, prevExData, numSets);
  while (frag.firstChild) exBlock.appendChild(frag.firstChild);
}

// ── TIME SETS HTML ──
function timeSetsHTML(stationKey, exData, prevExData, numSets, px) {
  const holdMax = exData.hold_max ?? '';
  const prevMax = prevExData.hold_max != null ? `prec. ${prevExData.hold_max}"` : '';
  const targetPerSet = holdMax !== '' ? Math.round(Number(holdMax) * 0.65) : null;
  const sets = exData.sets || [];
  const prevSets = prevExData.sets || [];
  const currentTotal = sets.reduce((a, v) => a + (v?.[0] || 0), 0);
  const totalColor = currentTotal >= TIME_TARGET_LOW ? 'var(--teal)' : 'var(--amber)';
  const accentColor = `var(${PAIR_COLORS[px] || '--muted'})`;

  const prBlock = `<div class="ex-time-pr">
    <div class="ex-vc-card">
      <div class="ex-vc-label">Hold max (PR)</div>
      <input class="ex-vc-input" data-pr="${stationKey}" type="number" inputmode="numeric" min="0" placeholder="—" value="${holdMax}" oninput="updateTimeTarget('${stationKey}')">
      <div class="ex-vc-unit">secondi</div>
      ${prevMax ? `<div class="ex-vc-prev">${prevMax}</div>` : ''}
    </div>
    <div class="ex-vc-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <div class="ex-vc-label">Target per set</div>
      <div id="time-target-${stationKey}" class="ex-vc-target-val" style="color:${accentColor}">${targetPerSet ? targetPerSet + '"' : '—'}</div>
      <div class="ex-vc-unit">65% del max</div>
    </div>
  </div>`;

  const setRows = Array.from({length: MAX_SETS}, (_, i) => {
    const val = sets[i]?.[0] ?? '';
    const prevVal = prevSets[i]?.[0] != null ? `${prevSets[i][0]}"` : '';
    return `<div class="time-set-row">
      <div class="time-set-label">S${i+1}</div>
      <input class="time-set-input" data-ex="${stationKey}" data-set="${i}" type="number" inputmode="numeric" min="0" placeholder="—" value="${val}" oninput="updateTimeTotal('${stationKey}')">
      <div class="time-set-unit">"</div>
      <div class="set-prev" style="min-width:32px;text-align:right;font-size:10px;color:var(--muted2);font-family:var(--mono)">${prevVal ? `↑${prevVal}` : ''}</div>
    </div>`;
  }).join('');

  return `${prBlock}
  <div class="time-sets">${setRows}</div>
  <div class="time-total-bar">
    <div class="time-total-label">Totale</div>
    <div>
      <span class="time-total-val" id="time-total-${stationKey}" style="color:${totalColor}">${currentTotal}"</span>
      <span class="time-total-target"> / ${TIME_TARGET_LOW}–${TIME_TARGET_HIGH}"</span>
    </div>
  </div>`;
}

function updateTimeTarget(stationKey) {
  const input = document.querySelector(`[data-pr="${stationKey}"]`);
  const max = parseInt(input?.value) || 0;
  const target = max > 0 ? Math.round(max * 0.65) : null;
  const el = document.getElementById(`time-target-${stationKey}`);
  if (el) el.textContent = target ? target + '"' : '—';
}

function updateTimeTotal(stationKey) {
  let total = 0;
  for (let i = 0; i < MAX_SETS; i++) {
    total += parseInt(document.querySelector(`.time-set-input[data-ex="${stationKey}"][data-set="${i}"]`)?.value) || 0;
  }
  const el = document.getElementById(`time-total-${stationKey}`);
  if (!el) return;
  el.textContent = total + '"';
  el.style.color = total >= TIME_TARGET_LOW ? 'var(--teal)' : 'var(--amber)';
}

// ── REPS SETS HTML ──
function repsSetsHTML(stationKey, exData, prevExData, numSets) {
  const sets = exData.sets || [];
  const prevSets = prevExData.sets || [];
  const setRows = Array.from({length: numSets}, (_, i) => {
    const f = sets[i]?.[0] ?? '';
    const c = sets[i]?.[1] ?? '';
    const pf = prevSets[i]?.[0];
    const pc = prevSets[i]?.[1];
    const prevStr = pf != null ? (pc ? `${pf}+${pc}` : `${pf}`) : '';
    return `<div class="set-row">
      <div class="set-label">S${i+1}</div>
      <div class="set-inputs">
        <div class="si-wrap">
          <div class="si-lbl">filate</div>
          <input class="si-input filate" data-ex="${stationKey}" data-set="${i}" data-type="f" type="number" inputmode="numeric" min="0" placeholder="—" value="${f}">
        </div>
        <div class="si-wrap">
          <div class="si-lbl">cluster</div>
          <input class="si-input cluster" data-ex="${stationKey}" data-set="${i}" data-type="c" type="number" inputmode="numeric" min="0" placeholder="—" value="${c}">
        </div>
      </div>
      <div class="set-prev">${prevStr ? `↑${prevStr}` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="sets-grid">${setRows}</div>
  <div class="cluster-hint">cluster dopo 5"–8" di riposo</div>`;
}

// ── PAIR STEP RENDER ──
function renderPairStep(stepIdx, s, prev) {
  const step = STEPS[stepIdx];
  const color = pairColor(step.px);
  // numSets: time stations always MAX_SETS, reps stations 3
  const numSets = 3;

  const exHTML = step.stations.map(({stationKey, px}) => {
    const exData = s[stationKey] || {};
    const prevExData = prev[stationKey] || {};
    const metric = getMetric(stationKey, exData.variant || '');
    const varHTML = variantSelectHTML(stationKey, exData.variant || '', prevExData.variant || '', px);
    const setsHTML = metric === 'time'
      ? timeSetsHTML(stationKey, exData, prevExData, MAX_SETS, px)
      : repsSetsHTML(stationKey, exData, prevExData, numSets);

    return `<div class="ex-block">
      <div class="ex-head">
        <div class="ex-color-dot" style="background:${pairColor(px)}"></div>
        <div class="ex-name">${getGroupLabel(stationKey)}</div>
      </div>
      ${varHTML}
      ${setsHTML}
    </div>`;
  }).join('');

  const hasTimeEx = step.stations.some(({stationKey}) => {
    const exData = s[stationKey] || {};
    return getMetric(stationKey, exData.variant || '') === 'time';
  });
  const setsLabel = hasTimeEx ? MAX_SETS : numSets;

  document.getElementById('step-content').innerHTML = `
    <div class="pair-header">
      <div class="pair-dot" style="background:${color}"></div>
      <div class="pair-title" style="color:${color}">${step.px.toUpperCase()}</div>
      <div class="pair-sub">${setsLabel} set · 30"</div>
    </div>
    ${exHTML}
  `;
}

// ── COLLECT ──
// collectStep reads the current form state and returns it as an object.
// It only writes to localStorage if the session already has a date (i.e. was explicitly saved).
function collectStep(stepIdx) {
  if (!STEPS.length) return;
  const data = getData();
  const sessionExists = data[currentSess]?.date != null;
  if (!sessionExists) return; // don't write unsaved sessions to localStorage
  const s = data[currentSess];
  const step = STEPS[stepIdx];

  step.stations.forEach(({stationKey}) => {
    if (!s[stationKey]) s[stationKey] = {};
    const exObj = s[stationKey];
    const selVariant = document.querySelector(`.variant-select[data-station="${stationKey}"]`);
    if (selVariant?.value) exObj.variant = selVariant.value;
    const metric = getMetric(stationKey, exObj.variant || '');
    const sets = [];
    if (metric === 'time') {
      const prInput = document.querySelector(`[data-pr="${stationKey}"]`);
      if (prInput?.value !== '') exObj.hold_max = parseInt(prInput.value) || 0;
      for (let i = 0; i < MAX_SETS; i++) {
        const ti = document.querySelector(`.time-set-input[data-ex="${stationKey}"][data-set="${i}"]`);
        sets.push([ti?.value !== '' ? parseInt(ti.value) : null, null]);
      }
    } else {
      for (let i = 0; i < 3; i++) {
        const fi = document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="f"]`);
        const ci = document.querySelector(`[data-ex="${stationKey}"][data-set="${i}"][data-type="c"]`);
        sets.push([fi?.value !== '' ? parseInt(fi.value) : null, ci?.value !== '' ? parseInt(ci.value) : null]);
      }
    }
    exObj.sets = sets;
  });

  saveData(data);
}

function saveSession() {
  // Force-write current form state even for new sessions
  const data = getData();
  if (!data[currentSess]) data[currentSess] = {};
  data[currentSess].date = new Date().toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'2-digit' });
  saveData(data); // write date first so collectStep will proceed
  collectStep(currentStep);
  document.getElementById('sess-date').textContent = getData()[currentSess].date;
  const toast = document.getElementById('toast');
  toast.textContent = '✓ Sessione salvata';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
  renderHistory();
  renderProgress();
}

// ── HISTORY ──
function variantArrow(stationKey, currentVariant, prevVariant) {
  if (!currentVariant || !prevVariant || currentVariant === prevVariant) return '';
  const variants = getGroupVariants(stationKey);
  const ci = variants.indexOf(currentVariant);
  const pi = variants.indexOf(prevVariant);
  if (ci === -1 || pi === -1) return '';
  return ci > pi
    ? `<span class="delta-pos" style="font-size:11px">↑</span>`
    : `<span class="delta-neg" style="font-size:11px">↓</span>`;
}

function renderHistory() {
  const data = getData();
  const list = document.getElementById('history-list');
  const sessions = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a,b) => b-a);
  if (!sessions.length) { list.innerHTML = '<div class="history-empty">Nessuna sessione ancora.</div>'; return; }

  function delta(val, prevVal, invertPositive) {
    if (val == null || prevVal == null) return '';
    const d = val - prevVal;
    if (d === 0) return '';
    const better = invertPositive ? d < 0 : d > 0;
    return `<span class="${better ? 'delta-pos' : 'delta-neg'}">${d > 0 ? '+' : ''}${d}</span>`;
  }

  list.innerHTML = sessions.map(n => {
    const s = data[n], prev = data[n-1] || {};
    const rows = [];

    STEPS.forEach(step => {
      const groupRows = [];
      step.stations.forEach(({stationKey}) => {
        const exObj = s[stationKey], prevExObj = prev[stationKey];
        if (!exObj?.sets) return;
        const metric = getMetric(stationKey, exObj.variant || '');
        const sameVariant = exObj.variant === prevExObj?.variant;
        const arrow = variantArrow(stationKey, exObj.variant, prevExObj?.variant);
        const vLabel = exObj.variant ? ` (${exObj.variant})` : '';

        if (metric === 'time') {
          const tot = exObj.sets.reduce((a,[t]) => a+(t||0), 0);
          const prevTot = sameVariant ? prevExObj?.sets?.reduce((a,[t]) => a+(t||0), 0) ?? null : null;
          const prevPR = sameVariant ? prevExObj?.hold_max ?? null : null;
          if (exObj.hold_max != null || tot > 0) {
            groupRows.push(`<div class="history-row">
              <span class="history-key">${getGroupLabel(stationKey)}${vLabel} ${arrow}</span>
              <span class="history-val">
                ${exObj.hold_max != null ? `<span><span style="color:var(--muted);font-size:10px">max </span>${exObj.hold_max}" ${delta(exObj.hold_max, prevPR, false)}</span>` : ''}
                ${tot > 0 ? `<span><span style="color:var(--muted);font-size:10px">tot </span>${tot}" ${delta(tot, prevTot, false)}</span>` : ''}
              </span>
            </div>`);
          }
        } else {
          const tot = exObj.sets.reduce((a,[f,c]) => a+(f||0)+(c||0), 0);
          const cl = exObj.sets.reduce((a,[f,c]) => a+(c||0), 0);
          const prevTot = sameVariant ? prevExObj?.sets?.reduce((a,[f,c]) => a+(f||0)+(c||0), 0) ?? null : null;
          const prevCl = sameVariant ? prevExObj?.sets?.reduce((a,[f,c]) => a+(c||0), 0) ?? null : null;
          groupRows.push(`<div class="history-row">
            <span class="history-key">${getGroupLabel(stationKey)}${vLabel} ${arrow}</span>
            <span class="history-val">${tot} rep ${delta(tot, prevTot, false)}</span>
          </div>`);
          if (cl > 0 || (prevCl != null && prevCl > 0)) {
            groupRows.push(`<div class="history-row">
              <span class="history-key">${getGroupLabel(stationKey)} cluster</span>
              <span class="history-val">${cl} ${delta(cl, prevCl, true)}</span>
            </div>`);
          }
        }
      });
      if (groupRows.length) {
        const pColor = pairColor(step.px);
        rows.push(`<div class="history-pair-header" style="color:${pColor}">${step.px.toUpperCase()} — ${step.label}</div>`);
        rows.push(...groupRows);
      }
    });

    return `<div class="history-sess">
      <div class="history-head" onclick="toggleHistory(this)">
        <span class="history-sess-num">Sessione ${n}</span>
        <div class="history-meta">
          <span class="history-date">${s.date||'—'}</span>
          <button class="delete-btn" onclick="deleteSession(event,${n})">✕</button>
        </div>
      </div>
      <div class="history-body">${rows.join('')||'<div style="font-size:12px;color:var(--muted);padding:4px 0">Nessun dato</div>'}</div>
    </div>`;
  }).join('');
}

function toggleHistory(el) { el.nextElementSibling.classList.toggle('open'); }
function deleteSession(e, n) {
  e.stopPropagation();
  if (!confirm(`Cancellare la sessione ${n}?`)) return;
  const data = getData(); delete data[n]; saveData(data);
  renderHistory(); renderProgress();
}

// ── PROGRESS ──
function renderProgress() {
  const data = getData();
  const sessions = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a,b) => a-b);
  const cont = document.getElementById('progress-content');
  if (sessions.length < 2) { cont.innerHTML = '<div class="history-empty">Inserisci almeno 2 sessioni<br>per vedere i progressi.</div>'; return; }

  function chartHTML(title, color, valFn, invertTrend, variantFn, stationKeyForArrow) {
    const vals = sessions.map(n => valFn(data[n]));
    const variants = variantFn ? sessions.map(n => variantFn(data[n])) : null;
    if (vals.every(v => v == null)) return '';
    const defined = vals.filter(v => v != null);
    const maxV = Math.max(...defined), minV = Math.min(...defined);
    // trend: only sessions with same variant as last
    const lastVariant = variants ? [...variants].reverse().find(v => v != null) : null;
    const sameVals = variants
      ? sessions.map((n,i) => variants[i] === lastVariant && vals[i] != null ? vals[i] : null).filter(v => v != null)
      : defined;
    const tFirst = sameVals[0] ?? defined[0];
    const tLast = sameVals[sameVals.length-1] ?? defined[defined.length-1];
    const trend = tLast - tFirst;
    const tLabel = sameVals.length < 2 ? '—' : (trend === 0 ? '=' : (trend > 0 ? '+'+trend : ''+trend));
    const tColor = sameVals.length < 2 ? 'var(--muted)' :
      trend === 0 ? 'var(--muted)' :
      (invertTrend ? (trend < 0 ? 'var(--teal)' : 'var(--coral)') : (trend > 0 ? 'var(--teal)' : 'var(--coral)'));

    const bars = sessions.map((n,i) => {
      const v = vals[i];
      if (v == null) return `<div class="prog-bar" style="background:var(--border);height:4px"><div class="prog-bar-label">S${n}</div></div>`;
      const h = maxV === minV ? 50 : ((v - minV) / (maxV - minV)) * 60 + 10;
      const variantChanged = stationKeyForArrow && variants && i > 0
        && variants[i] != null && variants[i-1] != null && variants[i] !== variants[i-1];
      let arrowLabel = `${v}`, valColor = color;
      if (variantChanged) {
        const allVars = getGroupVariants(stationKeyForArrow);
        const ci = allVars.indexOf(variants[i]);
        const pi = allVars.indexOf(variants[i-1]);
        const isAdvance = ci > pi;
        arrowLabel = (isAdvance ? '↑' : '↓') + v;
        valColor = isAdvance ? 'var(--teal)' : 'var(--coral)';
      }
      return `<div class="prog-bar" style="background:${color};height:${h}px"><div class="prog-val" style="color:${valColor}">${arrowLabel}</div><div class="prog-bar-label">S${n}</div></div>`;
    }).join('');

    const currentVariant = lastVariant
      ? `<span style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-left:6px">${lastVariant}</span>`
      : '';

    return `<div class="prog-section">
      <div class="prog-title">${title}${currentVariant}</div>
      <div class="prog-chart-wrap"><div class="prog-chart">${bars}</div></div>
      <div class="prog-stat-row">
        <div class="prog-stat"><div class="prog-stat-val" style="color:${color}">${defined[0]}</div><div class="prog-stat-lbl">inizio</div></div>
        <div class="prog-stat"><div class="prog-stat-val" style="color:${color}">${defined[defined.length-1]}</div><div class="prog-stat-lbl">attuale</div></div>
        <div class="prog-stat"><div class="prog-stat-val" style="color:${tColor}">${tLabel}</div><div class="prog-stat-lbl">trend</div></div>
      </div>
    </div>`;
  }

  function clPct(s, stationKey) {
    const e = s[stationKey]; if (!e?.sets) return null;
    const tot = e.sets.reduce((a,[f,c]) => a+(f||0)+(c||0), 0);
    const cl = e.sets.reduce((a,[f,c]) => a+(c||0), 0);
    return tot > 0 ? Math.round(cl/tot*100) : null;
  }

  function stationVal(s, stationKey) {
    const e = s[stationKey]; if (!e?.sets) return null;
    const metric = getMetric(stationKey, e.variant || '');
    if (metric === 'time') {
      const tot = e.sets.reduce((a,[t]) => a+(t||0), 0);
      return tot > 0 ? tot : null;
    }
    const r = e.sets[0]; return r ? (r[0]||0)+(r[1]||0) : null;
  }

  function stationPR(s, stationKey) {
    return s[stationKey]?.hold_max ?? null;
  }

  const sections = STEPS.map(step => {
    const color = pairColor(step.px);
    const charts = [];
    step.stations.forEach(({stationKey}) => {
      const label = getGroupLabel(stationKey);
      // Determine metric: use last known variant, fallback to group default
      const lastKnownVariant = [...sessions].reverse().map(n => getData()[n]?.[stationKey]?.variant).find(v => v) || '';
      const metric = getMetric(stationKey, lastKnownVariant);
      if (metric === 'time') {
        charts.push(chartHTML(`${label} — PR`, color, s => stationPR(s, stationKey), false, s => s[stationKey]?.variant ?? null, stationKey));
        charts.push(chartHTML(`${label} — tot.`, color, s => stationVal(s, stationKey), false, s => s[stationKey]?.variant ?? null, stationKey));
      } else {
        charts.push(chartHTML(`${label} — rep`, color, s => stationVal(s, stationKey), false, s => s[stationKey]?.variant ?? null, stationKey));
        charts.push(chartHTML(`${label} — cluster %`, color, s => clPct(s, stationKey), true, s => s[stationKey]?.variant ?? null, stationKey));
      }
    });
    const rendered = charts.filter(Boolean);
    if (!rendered.length) return '';
    return `<div class="prog-pair-header" style="color:${color}">${step.px.toUpperCase()} — ${step.label}</div>` + rendered.join('');
  }).filter(Boolean);

  cont.innerHTML = sections.join('') || '<div class="history-empty">Dati insufficienti.</div>';
}

// ── USER MENU ──
function toggleUserMenu() {
  const menu = document.getElementById('user-menu');
  menu.classList.toggle('open');
  if (menu.classList.contains('open')) {
    setTimeout(() => document.addEventListener('click', closeUserMenuOutside, { once: true }), 0);
  }
}
function closeUserMenuOutside(e) {
  const wrap = document.querySelector('.user-menu-wrap');
  if (!wrap.contains(e.target)) document.getElementById('user-menu').classList.remove('open');
}
function closeUserMenu() { document.getElementById('user-menu').classList.remove('open'); }

// ── NAME MODAL ──
function openNameModal() { document.getElementById('name-modal').classList.add('open'); setTimeout(() => document.getElementById('name-input').focus(), 100); }
function saveName() {
  const v = document.getElementById('name-input').value.trim();
  if (!v) return;
  localStorage.setItem(KEY_NAME, v);
  document.getElementById('name-badge').textContent = v;
  document.getElementById('name-modal').classList.remove('open');
  currentSess = 1; currentStep = 0;
  const nums = Object.keys(getData()).map(Number).filter(n => !isNaN(n));
  if (nums.length) currentSess = Math.max(...nums);
  renderStepDots(); renderStep(); renderHistory(); renderProgress();
}
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });

// ── RENAME ──
function openRenameModal() {
  closeUserMenu();
  const current = getName();
  document.getElementById('rename-input').value = current;
  const hasData = Object.keys(getData()).some(k => !isNaN(Number(k)));
  const count = Object.keys(getData()).filter(k => !isNaN(Number(k))).length;
  document.getElementById('rename-hint').textContent = hasData
    ? `Hai ${count} sessioni salvate come "${current}".`
    : `Nessun dato salvato come "${current}".`;
  document.getElementById('rename-btn-carry').style.display = hasData ? '' : 'none';
  document.getElementById('rename-modal').classList.add('open');
  setTimeout(() => document.getElementById('rename-input').focus(), 100);
}
function saveRename(carryData) {
  const newName = document.getElementById('rename-input').value.trim();
  if (!newName) return;
  const oldName = getName();
  if (newName !== oldName && carryData) {
    const oldData = getData();
    const newKey = 'cali_sessions_' + newName.toLowerCase().replace(/\s+/g,'_');
    localStorage.setItem(newKey, JSON.stringify(oldData));
    localStorage.removeItem('cali_sessions_' + oldName.toLowerCase().replace(/\s+/g,'_'));
  }
  localStorage.setItem(KEY_NAME, newName);
  document.getElementById('name-badge').textContent = newName;
  document.getElementById('rename-modal').classList.remove('open');
  currentSess = 1; currentStep = 0;
  const nums = Object.keys(getData()).map(Number).filter(n => !isNaN(n));
  if (nums.length) currentSess = Math.max(...nums);
  renderStepDots(); renderStep(); renderHistory(); renderProgress();
}
document.getElementById('rename-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveRename(true); });

// ── EXPORT ──
function exportData() {
  closeUserMenu();
  const name = getName();
  const payload = { name, sessions: getData(), exported: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cali-tracker-${name.toLowerCase().replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── IMPORT ──
let _importPayload = null;
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const payload = JSON.parse(ev.target.result);
      if (!payload.sessions || typeof payload.sessions !== 'object') throw new Error('Formato non valido');
      _importPayload = payload;
      const count = Object.keys(payload.sessions).filter(k => !isNaN(Number(k))).length;
      const exported = payload.exported ? new Date(payload.exported).toLocaleDateString('it-IT') : '—';
      document.getElementById('import-modal-body').innerHTML =
        `File: <b>${file.name}</b><br>Utente: <b>${payload.name || '—'}</b><br>Sessioni: <b>${count}</b><br>Esportato il: <b>${exported}</b><br><br>` +
        `Verranno importati come <b>${getName()}</b>.<br><span style="color:var(--coral)">I dati esistenti verranno sovrascritti.</span>`;
      document.getElementById('import-confirm-btn').onclick = confirmImport;
      document.getElementById('import-modal').classList.add('open');
    } catch(err) { alert('File non valido: ' + err.message); }
  };
  reader.readAsText(file);
}
function confirmImport() {
  if (!_importPayload) return;
  saveData(_importPayload.sessions);
  _importPayload = null;
  document.getElementById('import-modal').classList.remove('open');
  currentSess = 1; currentStep = 0;
  const nums = Object.keys(getData()).map(Number).filter(n => !isNaN(n));
  if (nums.length) currentSess = Math.max(...nums);
  renderStepDots(); renderStep(); renderHistory(); renderProgress();
  const toast = document.getElementById('toast');
  toast.textContent = '✓ Dati importati';
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); toast.textContent = '✓ Sessione salvata'; }, 2500);
}

// ── TABS ──
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', ['log','history','progress'][i] === t));
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  if (t === 'history') renderHistory();
  if (t === 'progress') renderProgress();
}

// ── SWIPE ──
(function() {
  let startX = 0, startY = 0;
  const el = document.getElementById('page-log');
  el.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0) goStep(1);   // swipe left → next
    else goStep(-1);          // swipe right → prev
  }, { passive: true });
})();

init();
</script>
