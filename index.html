<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cali Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0c;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #272727;
  --border2: #333;
  --text: #eeebe6;
  --muted: #7a7672;
  --muted2: #444;
  --accent: #c8f060;
  --accent2: #8fb840;
  --teal: #4dd9a0;
  --coral: #f07060;
  --amber: #f0b840;
  --purple: #b090f0;
  --blue: #60a8f0;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; max-width: 480px; margin: 0 auto; }

.app-header { padding: 18px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.app-title { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }
.name-badge { font-size: 12px; color: var(--muted); font-family: var(--mono); cursor: pointer; border: 1px solid var(--border2); border-radius: 20px; padding: 4px 10px; }

.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; letter-spacing: .03em; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.page { display: none; }
.page.active { display: block; }

/* SESSION BAR */
.sess-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sess-info { display: flex; align-items: baseline; gap: 8px; }
.sess-num-big { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--accent); }
.sess-date-sm { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sess-nav { display: flex; gap: 6px; }
.sess-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.sess-btn:active { background: var(--surface2); }

/* STEP */
.step-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 0; }
.step-label { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.step-dots { display: flex; gap: 5px; }
.step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); transition: background .2s; }
.step-dot.active { background: var(--accent); }
.step-dot.done { background: var(--muted2); }

.step-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 14px; gap: 10px; }
.nav-btn { flex: 1; padding: 11px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); border-radius: var(--r); font-size: 13px; font-family: var(--sans); cursor: pointer; }
.nav-btn:active { background: var(--surface2); }
.nav-btn:disabled { opacity: .3; cursor: default; }
.save-btn { flex: 2; padding: 11px; background: var(--accent); color: #0c0c0c; border: none; border-radius: var(--r); font-size: 14px; font-weight: 600; font-family: var(--sans); cursor: pointer; }
.save-btn:active { background: var(--accent2); }

.step-content { padding: 14px 16px 0; }

/* VERTICALE */
.vert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.vert-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.vc-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.vc-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 8px; font-size: 26px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; }
.vc-input::-webkit-inner-spin-button, .vc-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.vc-input:focus { outline: none; border-color: var(--purple); }
.vc-unit { font-size: 10px; color: var(--muted2); font-family: var(--mono); text-align: center; margin-top: 4px; }
.vc-prev { font-size: 10px; color: var(--muted); font-family: var(--mono); text-align: center; margin-top: 3px; }

/* VARIANT SELECTOR */
.variant-row { margin-bottom: 8px; }
.variant-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.variant-prev { font-size: 10px; color: var(--muted2); font-family: var(--mono); margin-bottom: 5px; }
.variant-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.variant-chip { padding: 5px 10px; border: 1px solid var(--border2); border-radius: 20px; font-size: 12px; color: var(--muted); cursor: pointer; transition: all .15s; background: var(--surface); white-space: nowrap; }
.variant-chip.selected { border-color: currentColor; color: var(--text); background: var(--surface2); }

/* PAIR */
.pair-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.pair-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pair-title { font-size: 14px; font-weight: 600; }
.pair-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: auto; }

.ex-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
.ex-head { padding: 9px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.ex-color { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.ex-name { font-size: 12px; font-weight: 500; }
.ex-tag { font-size: 10px; font-family: var(--mono); color: var(--muted); background: var(--surface2); border-radius: 4px; padding: 2px 6px; margin-left: auto; }

.ex-variant { padding: 8px 12px; border-bottom: 1px solid var(--border); }

.sets-grid { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.set-row { display: flex; align-items: center; gap: 8px; }
.set-label { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; }
.set-inputs { display: flex; gap: 6px; flex: 1; }
.si-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.si-lbl { font-size: 9px; color: var(--muted2); font-family: var(--mono); text-align: center; text-transform: uppercase; letter-spacing: .04em; }
.si-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; }
.si-input::-webkit-inner-spin-button, .si-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.si-input.filate:focus { border-color: var(--teal); }
.si-input.cluster:focus { border-color: var(--amber); }
.set-prev { font-family: var(--mono); font-size: 10px; color: var(--muted2); white-space: nowrap; min-width: 44px; text-align: right; }
.cluster-hint { font-size: 10px; color: var(--amber); font-family: var(--mono); text-align: center; padding: 6px 12px 10px; opacity: .7; }

/* HISTORY */
#page-history { padding: 16px; }
.history-empty { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 13px; line-height: 1.9; }
.history-sess { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.history-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.history-sess-num { font-family: var(--mono); font-size: 13px; color: var(--accent); }
.history-meta { display: flex; align-items: center; gap: 10px; }
.history-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.delete-btn { background: none; border: 1px solid var(--border2); border-radius: 6px; color: var(--muted); font-size: 11px; padding: 3px 7px; cursor: pointer; }
.delete-btn:active { background: var(--coral); color: #0c0c0c; border-color: var(--coral); }
.history-body { padding: 10px 14px; display: none; border-top: 1px solid var(--border); }
.history-body.open { display: block; }
.h-section-title { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 4px; }
.history-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.history-row:last-child { border-bottom: none; }
.history-key { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.history-val { font-family: var(--mono); font-weight: 500; font-size: 12px; display: flex; align-items: center; gap: 4px; }
.delta-pos { color: var(--teal); font-size: 10px; }
.delta-neg { color: var(--coral); font-size: 10px; }

/* PROGRESS */
#page-progress { padding: 16px; }
.prog-section { margin-bottom: 24px; }
.prog-title { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.prog-chart-wrap { padding-bottom: 22px; }
.prog-chart { height: 80px; display: flex; align-items: flex-end; gap: 4px; }
.prog-bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 4px; position: relative; }
.prog-bar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); font-family: var(--mono); }
.prog-val { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 9px; font-family: var(--mono); font-weight: 500; white-space: nowrap; }
.prog-stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 6px; }
.prog-stat { background: var(--surface); border-radius: 8px; padding: 10px; text-align: center; }
.prog-stat-val { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.prog-stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
.modal-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; font-size: 16px; color: var(--text); font-family: var(--sans); }
.modal-input:focus { outline: none; border-color: var(--accent); }
.modal-btn { width: 100%; margin-top: 12px; padding: 12px; background: var(--accent); color: #0c0c0c; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); }

.toast { text-align: center; font-size: 12px; color: var(--accent); font-family: var(--mono); padding: 8px; opacity: 0; transition: opacity .3s; }
.toast.show { opacity: 1; }
.loading { text-align: center; padding: 40px 16px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">Cali Tracker</div>
  <div class="name-badge" id="name-badge" onclick="openNameModal()">— imposta nome</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('log')">Inserisci</div>
  <div class="tab" onclick="switchTab('history')">Storico</div>
  <div class="tab" onclick="switchTab('progress')">Progressi</div>
</div>

<div class="page active" id="page-log">
  <div class="sess-bar">
    <div class="sess-info">
      <div class="sess-num-big" id="sess-num">1</div>
      <div class="sess-date-sm" id="sess-date">—</div>
    </div>
    <div class="sess-nav">
      <button class="sess-btn" onclick="changeSess(-1)">‹</button>
      <button class="sess-btn" onclick="changeSess(1)">›</button>
    </div>
  </div>
  <div class="step-bar">
    <div class="step-label" id="step-label">Verticale</div>
    <div class="step-dots" id="step-dots"></div>
  </div>
  <div class="step-content" id="step-content"><div class="loading">Caricamento esercizi…</div></div>
  <div class="step-nav">
    <button class="nav-btn" id="btn-prev" onclick="goStep(-1)">‹ Indietro</button>
    <button class="nav-btn" id="btn-next" onclick="goStep(1)">Avanti ›</button>
    <button class="save-btn" id="btn-save" onclick="saveSession()" style="display:none">Salva ✓</button>
  </div>
  <div class="toast" id="toast">✓ Sessione salvata</div>
</div>

<div class="page" id="page-history">
  <div id="history-list"><div class="history-empty">Nessuna sessione ancora.</div></div>
</div>

<div class="page" id="page-progress">
  <div id="progress-content"><div class="history-empty">Inserisci almeno 2 sessioni<br>per vedere i progressi.</div></div>
</div>

<div class="modal-overlay" id="name-modal">
  <div class="modal">
    <div class="modal-title">Come ti chiami?</div>
    <input class="modal-input" id="name-input" type="text" placeholder="Il tuo nome" maxlength="30">
    <button class="modal-btn" onclick="saveName()">Salva</button>
  </div>
</div>

<script>
// ── DATA MODEL ──
// session: {
//   date,
//   hold_max, hold_work,
//   s_vert_variant,           ← variante esercizio verticale
//   p1: {
//     s5: { variant: "Ring pushup", sets: [[f,c],[f,c],[f,c]] },
//     s1: { variant: "Ring row",    sets: [[f,c],[f,c],[f,c]] }
//   },
//   p2: { s7: { variant, sets }, s3: { variant, sets } },
//   p3: { s6: { variant, sets }, s8: { variant, sets } },
//   p4: { s4: { variant, sets }, s2: { variant, sets } }
// }

const KEY_NAME = 'cali_name';
function sessKey() { return 'cali_sessions_' + (getName().toLowerCase().replace(/\s+/g,'_') || 'default'); }
function getData() { try { return JSON.parse(localStorage.getItem(sessKey())) || {}; } catch(e) { return {}; } }
function saveData(d) { localStorage.setItem(sessKey(), JSON.stringify(d)); }
function getName() { return localStorage.getItem(KEY_NAME) || ''; }

let currentSess = 1;
let currentStep = 0;
const TOTAL_STEPS = 5;

// Mappa stazione → categoria del JSON
const STATION_CATEGORY = {
  s_vert: 'spinta_verticale',
  s5: 'spinta_orizzontale',
  s1: 'tirata_orizzontale',
  s3: 'tirata_verticale',
  s6: 'gamba_anteriore',
  s8: 'gamba_posteriore',
  s4: 'core',
  s2: 'catena_posteriore',
  s7: null  // support hold: nessuna variante, solo secondi
};

const PAIRS = [
  null,
  { id:'p1', label:'P1', color:'var(--teal)', sets:3, exercises:[
    { key:'s5', name:'S5 — Spinta orizzontale', color:'var(--teal)', tag:'spinta orizz.' },
    { key:'s1', name:'S1 — Tirata orizzontale', color:'var(--teal)', tag:'tiraggio orizz.' }
  ]},
  { id:'p2', label:'P2', color:'var(--coral)', sets:3, exercises:[
    { key:'s7', name:'S7 — Support hold', color:'var(--amber)', tag:'sec. per set' },
    { key:'s3', name:'S3 — Tirata verticale', color:'var(--coral)', tag:'tiraggio vert.' }
  ]},
  { id:'p3', label:'P3', color:'var(--blue)', sets:2, exercises:[
    { key:'s6', name:'S6 — Gamba anteriore', color:'var(--blue)', tag:'unilaterale' },
    { key:'s8', name:'S8 — Gamba posteriore', color:'var(--blue)', tag:'catena post.' }
  ]},
  { id:'p4', label:'P4', color:'var(--purple)', sets:2, exercises:[
    { key:'s4', name:'S4 — Core', color:'var(--purple)', tag:'core' },
    { key:'s2', name:'S2 — Catena posteriore', color:'var(--purple)', tag:'catena post.' }
  ]}
];

let EXERCISES = null; // loaded from exercises.json

function getVariants(stationKey) {
  const cat = STATION_CATEGORY[stationKey];
  if (!cat || !EXERCISES || !EXERCISES[cat]) return [];
  return EXERCISES[cat].variants || [];
}

// ── LOAD EXERCISES ──
async function loadExercises() {
  try {
    const res = await fetch('exercises.json');
    if (!res.ok) throw new Error('not found');
    EXERCISES = await res.json();
  } catch(e) {
    console.warn('exercises.json non trovato, varianti non disponibili');
    EXERCISES = {};
  }
}

// ── INIT ──
async function init() {
  const name = getName();
  if (!name) openNameModal();
  else document.getElementById('name-badge').textContent = name;

  await loadExercises();

  const data = getData();
  const nums = Object.keys(data).map(Number).filter(n => !isNaN(n));
  if (nums.length > 0) currentSess = Math.max(...nums);
  renderStepDots();
  renderStep();
  renderHistory();
  renderProgress();
}

// ── SESSION NAV ──
function changeSess(d) {
  collectStep(currentStep);
  const next = currentSess + d;
  if (next < 1 || next > 30) return;
  currentSess = next;
  currentStep = 0;
  renderStepDots();
  renderStep();
}

// ── STEP NAV ──
function renderStepDots() {
  const cont = document.getElementById('step-dots');
  cont.innerHTML = Array.from({length: TOTAL_STEPS}, (_, i) => {
    const cls = i === currentStep ? 'active' : (i < currentStep ? 'done' : '');
    return `<div class="step-dot ${cls}"></div>`;
  }).join('');
}

function goStep(d) {
  collectStep(currentStep);
  currentStep = Math.max(0, Math.min(TOTAL_STEPS - 1, currentStep + d));
  renderStepDots();
  renderStep();
}

function renderStep() {
  const labels = ['Verticale', 'P1 — Spinta + Tirata orizz.', 'P2 — Support hold + Tirata vert.', 'P3 — Gambe', 'P4 — Core + Catena post.'];
  document.getElementById('step-label').textContent = labels[currentStep];
  document.getElementById('btn-prev').disabled = currentStep === 0;
  document.getElementById('btn-next').style.display = currentStep < TOTAL_STEPS - 1 ? '' : 'none';
  document.getElementById('btn-save').style.display = currentStep === TOTAL_STEPS - 1 ? '' : 'none';

  const data = getData();
  const s = data[currentSess] || {};
  const prev = data[currentSess - 1] || {};
  document.getElementById('sess-num').textContent = currentSess;
  document.getElementById('sess-date').textContent = s.date || '—';

  if (currentStep === 0) renderVertStep(s, prev);
  else renderPairStep(currentStep, s, prev);
}

// ── VERTICALE STEP ──
function renderVertStep(s, prev) {
  const pm = prev.hold_max !== undefined ? `prec. ${prev.hold_max}"` : '';
  const pw = prev.hold_work !== undefined ? `prec. ${prev.hold_work}"` : '';
  const variants = getVariants('s_vert');
  const selectedVariant = s.s_vert_variant || '';
  const prevVariant = prev.s_vert_variant || '';

  const variantHTML = variants.length ? `
    <div class="variant-row">
      <div class="variant-label">Esercizio</div>
      ${prevVariant ? `<div class="variant-prev">sessione prec.: ${prevVariant}</div>` : ''}
      <div class="variant-chips" id="chips-s_vert">
        ${variants.map(v => `<div class="variant-chip ${selectedVariant === v ? 'selected' : ''}" onclick="selectVariant('s_vert', this)">${v}</div>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('step-content').innerHTML = `
    ${variantHTML}
    <div class="vert-grid">
      <div class="vert-card">
        <div class="vc-label">Hold max</div>
        <input class="vc-input" id="hold_max" type="number" inputmode="numeric" min="0" placeholder="—" value="${s.hold_max ?? ''}">
        <div class="vc-unit">secondi</div>
        ${pm ? `<div class="vc-prev">${pm}</div>` : ''}
      </div>
      <div class="vert-card">
        <div class="vc-label">Lavoro 60–70%</div>
        <input class="vc-input" id="hold_work" type="number" inputmode="numeric" min="0" placeholder="—" value="${s.hold_work ?? ''}">
        <div class="vc-unit">secondi effettivi</div>
        ${pw ? `<div class="vc-prev">${pw}</div>` : ''}
      </div>
    </div>
  `;
}

// ── PAIR STEP ──
function renderPairStep(step, s, prev) {
  const pair = PAIRS[step];
  const pairData = s[pair.id] || {};
  const prevPair = prev[pair.id] || {};

  const exHTML = pair.exercises.map(ex => {
    const exData = pairData[ex.key] || {};
    const prevExData = prevPair[ex.key] || {};
    const sets = exData.sets || [];
    const prevSets = prevExData.sets || [];
    const selectedVariant = exData.variant || '';
    const prevVariant = prevExData.variant || '';
    const variants = getVariants(ex.key);

    const variantHTML = variants.length ? `
      <div class="ex-variant">
        ${prevVariant ? `<div class="variant-prev" style="margin-bottom:5px">sessione prec.: ${prevVariant}</div>` : ''}
        <div class="variant-chips" id="chips-${ex.key}">
          ${variants.map(v => `<div class="variant-chip ${selectedVariant === v ? 'selected' : ''}" style="border-color:${selectedVariant === v ? ex.color : ''};color:${selectedVariant === v ? ex.color : ''}" onclick="selectVariant('${ex.key}', this, '${ex.color}')">${v}</div>`).join('')}
        </div>
      </div>` : '';

    const setRows = Array.from({length: pair.sets}, (_, i) => {
      const f = sets[i]?.[0] ?? '';
      const c = sets[i]?.[1] ?? '';
      const pf = prevSets[i]?.[0];
      const pc = prevSets[i]?.[1];
      const prevStr = pf !== undefined ? (pc ? `${pf}+${pc}` : `${pf}`) : '';
      return `<div class="set-row">
        <div class="set-label">S${i+1}</div>
        <div class="set-inputs">
          <div class="si-wrap">
            <div class="si-lbl">filate</div>
            <input class="si-input filate" data-ex="${ex.key}" data-set="${i}" data-type="f" type="number" inputmode="numeric" min="0" placeholder="—" value="${f}">
          </div>
          <div class="si-wrap">
            <div class="si-lbl">cluster</div>
            <input class="si-input cluster" data-ex="${ex.key}" data-set="${i}" data-type="c" type="number" inputmode="numeric" min="0" placeholder="—" value="${c}">
          </div>
        </div>
        <div class="set-prev">${prevStr ? `↑${prevStr}` : ''}</div>
      </div>`;
    }).join('');

    return `<div class="ex-block">
      <div class="ex-head">
        <div class="ex-color" style="background:${ex.color}"></div>
        <div class="ex-name">${ex.name}</div>
        <div class="ex-tag">${ex.tag}</div>
      </div>
      ${variantHTML}
      <div class="sets-grid">${setRows}</div>
      <div class="cluster-hint">cluster dopo 5"–8" di riposo</div>
    </div>`;
  }).join('');

  document.getElementById('step-content').innerHTML = `
    <div class="pair-header">
      <div class="pair-dot" style="background:${pair.color}"></div>
      <div class="pair-title" style="color:${pair.color}">${pair.label}</div>
      <div class="pair-sub">${pair.sets} set · 30"</div>
    </div>
    ${exHTML}
  `;
}

function selectVariant(stationKey, el, color) {
  const container = document.getElementById('chips-' + stationKey);
  container.querySelectorAll('.variant-chip').forEach(c => {
    c.classList.remove('selected');
    c.style.borderColor = '';
    c.style.color = '';
  });
  el.classList.add('selected');
  if (color) { el.style.borderColor = color; el.style.color = color; }
}

// ── COLLECT ──
function collectStep(step) {
  const data = getData();
  if (!data[currentSess]) data[currentSess] = {};
  const s = data[currentSess];

  if (step === 0) {
    const hm = document.getElementById('hold_max')?.value;
    const hw = document.getElementById('hold_work')?.value;
    if (hm !== '' && hm != null) s.hold_max = parseInt(hm) || 0;
    if (hw !== '' && hw != null) s.hold_work = parseInt(hw) || 0;
    // variant
    const selChip = document.querySelector('#chips-s_vert .variant-chip.selected');
    if (selChip) s.s_vert_variant = selChip.textContent;
  } else {
    const pair = PAIRS[step];
    if (!s[pair.id]) s[pair.id] = {};
    pair.exercises.forEach(ex => {
      if (!s[pair.id][ex.key]) s[pair.id][ex.key] = {};
      const exObj = s[pair.id][ex.key];
      // variant
      const selChip = document.querySelector(`#chips-${ex.key} .variant-chip.selected`);
      if (selChip) exObj.variant = selChip.textContent;
      // sets
      const sets = [];
      for (let i = 0; i < pair.sets; i++) {
        const fi = document.querySelector(`[data-ex="${ex.key}"][data-set="${i}"][data-type="f"]`);
        const ci = document.querySelector(`[data-ex="${ex.key}"][data-set="${i}"][data-type="c"]`);
        const f = fi?.value !== '' ? parseInt(fi.value) : null;
        const c = ci?.value !== '' ? parseInt(ci.value) : null;
        sets.push([f, c]);
      }
      exObj.sets = sets;
    });
  }
  saveData(data);
  const d = getData();
  document.getElementById('sess-date').textContent = d[currentSess]?.date || '—';
}

function saveSession() {
  collectStep(currentStep);
  const data = getData();
  if (!data[currentSess]) data[currentSess] = {};
  data[currentSess].date = new Date().toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'2-digit' });
  saveData(data);
  document.getElementById('sess-date').textContent = data[currentSess].date;
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
  renderHistory();
  renderProgress();
}

// ── HISTORY ──
function renderHistory() {
  const data = getData();
  const list = document.getElementById('history-list');
  const sessions = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a,b) => b-a);
  if (!sessions.length) { list.innerHTML = '<div class="history-empty">Nessuna sessione ancora.<br>Inserisci i dati nella tab "Inserisci".</div>'; return; }

  function delta(val, prevVal, invertPositive) {
    if (val == null || prevVal == null) return '';
    const d = val - prevVal;
    if (d === 0) return '';
    const better = invertPositive ? d < 0 : d > 0;
    return `<span class="${better ? 'delta-pos' : 'delta-neg'}">${d > 0 ? '+' : ''}${d}</span>`;
  }
  function totSets(exObj) {
    if (!exObj?.sets) return null;
    return exObj.sets.reduce((a,[f,c]) => a+(f||0)+(c||0), 0);
  }
  function clusterSets(exObj) {
    if (!exObj?.sets) return null;
    return exObj.sets.reduce((a,[f,c]) => a+(c||0), 0);
  }

  list.innerHTML = sessions.map(n => {
    const s = data[n];
    const prev = data[n-1] || {};
    const rows = [];

    if (s.hold_max != null) rows.push(`<div class="history-row"><span class="history-key">Hold max</span><span class="history-val">${s.hold_max}" ${delta(s.hold_max, prev.hold_max, false)}</span></div>`);
    if (s.hold_work != null) rows.push(`<div class="history-row"><span class="history-key">Hold lavoro</span><span class="history-val">${s.hold_work}" ${delta(s.hold_work, prev.hold_work, false)}</span></div>`);
    if (s.s_vert_variant) rows.push(`<div class="history-row"><span class="history-key">Verticale</span><span class="history-val">${s.s_vert_variant}</span></div>`);

    [['p1','s5'],['p1','s1'],['p2','s7'],['p2','s3'],['p3','s6'],['p3','s8'],['p4','s4'],['p4','s2']].forEach(([p,k]) => {
      const exObj = s[p]?.[k];
      const prevExObj = prev[p]?.[k];
      if (!exObj?.sets) return;
      const tot = totSets(exObj);
      const cl = clusterSets(exObj);
      const prevTot = totSets(prevExObj);
      const prevCl = clusterSets(prevExObj);
      const variantLabel = exObj.variant ? ` (${exObj.variant})` : '';
      rows.push(`<div class="history-row"><span class="history-key">${k.toUpperCase()}${variantLabel}</span><span class="history-val">${tot} rep ${delta(tot, prevTot, false)}</span></div>`);
      if (cl > 0 || (prevCl != null && prevCl > 0)) rows.push(`<div class="history-row"><span class="history-key">${k.toUpperCase()} cluster</span><span class="history-val">${cl} ${delta(cl, prevCl, true)}</span></div>`);
    });

    return `<div class="history-sess">
      <div class="history-head" onclick="toggleHistory(this)">
        <span class="history-sess-num">Sessione ${n}</span>
        <div class="history-meta">
          <span class="history-date">${s.date || '—'}</span>
          <button class="delete-btn" onclick="deleteSession(event,${n})">✕</button>
        </div>
      </div>
      <div class="history-body">${rows.join('') || '<div style="font-size:12px;color:var(--muted);padding:4px 0">Nessun dato</div>'}</div>
    </div>`;
  }).join('');
}

function toggleHistory(el) { el.nextElementSibling.classList.toggle('open'); }
function deleteSession(e, n) {
  e.stopPropagation();
  if (!confirm(`Cancellare la sessione ${n}?`)) return;
  const data = getData(); delete data[n]; saveData(data);
  renderHistory(); renderProgress();
}

// ── PROGRESS ──
function renderProgress() {
  const data = getData();
  const sessions = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a,b) => a-b);
  const cont = document.getElementById('progress-content');
  if (sessions.length < 2) { cont.innerHTML = '<div class="history-empty">Inserisci almeno 2 sessioni<br>per vedere i progressi.</div>'; return; }

  function chartHTML(title, color, valFn, invertTrend) {
    const vals = sessions.map(n => valFn(data[n]));
    if (vals.every(v => v == null)) return '';
    const defined = vals.filter(v => v != null);
    const max = Math.max(...defined), min = Math.min(...defined);
    const first = defined[0], last = defined[defined.length-1];
    const trend = last - first;
    const trendLabel = trend === 0 ? '=' : (trend > 0 ? '+'+trend : ''+trend);
    const trendColor = trend === 0 ? 'var(--muted)' : (invertTrend ? (trend < 0 ? 'var(--teal)' : 'var(--coral)') : (trend > 0 ? 'var(--teal)' : 'var(--coral)'));
    const bars = sessions.map((n,i) => {
      const v = vals[i];
      if (v == null) return `<div class="prog-bar" style="background:var(--border);height:4px"><div class="prog-bar-label">S${n}</div></div>`;
      const h = max === min ? 50 : ((v - min) / (max - min)) * 60 + 10;
      return `<div class="prog-bar" style="background:${color};height:${h}px"><div class="prog-val" style="color:${color}">${v}</div><div class="prog-bar-label">S${n}</div></div>`;
    }).join('');
    return `<div class="prog-section">
      <div class="prog-title">${title}</div>
      <div class="prog-chart-wrap"><div class="prog-chart">${bars}</div></div>
      <div class="prog-stat-row">
        <div class="prog-stat"><div class="prog-stat-val" style="color:${color}">${first}</div><div class="prog-stat-lbl">inizio</div></div>
        <div class="prog-stat"><div class="prog-stat-val" style="color:${color}">${last}</div><div class="prog-stat-lbl">attuale</div></div>
        <div class="prog-stat"><div class="prog-stat-val" style="color:${trendColor}">${trendLabel}</div><div class="prog-stat-lbl">trend</div></div>
      </div>
    </div>`;
  }

  function totEx(s, p, k) { const e = s[p]?.[k]; return e?.sets ? e.sets.reduce((a,[f,c])=>a+(f||0)+(c||0),0) : null; }
  function clPct(s, p, k) {
    const e = s[p]?.[k]; if (!e?.sets) return null;
    const tot = e.sets.reduce((a,[f,c])=>a+(f||0)+(c||0),0);
    const cl = e.sets.reduce((a,[f,c])=>a+(c||0),0);
    return tot > 0 ? Math.round(cl/tot*100) : 0;
  }

  cont.innerHTML = [
    chartHTML('Hold max — verticale', 'var(--purple)', s => s.hold_max ?? null, false),
    chartHTML('S5 Spinta orizz. — rep totali (S1)', 'var(--teal)', s => { const r = s.p1?.s5?.sets?.[0]; return r ? (r[0]||0)+(r[1]||0) : null; }, false),
    chartHTML('S1 Tirata orizz. — rep totali (S1)', 'var(--teal)', s => { const r = s.p1?.s1?.sets?.[0]; return r ? (r[0]||0)+(r[1]||0) : null; }, false),
    chartHTML('S7 Support hold — rep totali (S1)', 'var(--amber)', s => { const r = s.p2?.s7?.sets?.[0]; return r ? (r[0]||0)+(r[1]||0) : null; }, false),
    chartHTML('S3 Tirata vert. — rep totali (S1)', 'var(--coral)', s => { const r = s.p2?.s3?.sets?.[0]; return r ? (r[0]||0)+(r[1]||0) : null; }, false),
    chartHTML('S5 cluster % — trend verso zero', 'var(--amber)', s => clPct(s,'p1','s5'), true),
    chartHTML('S1 cluster % — trend verso zero', 'var(--amber)', s => clPct(s,'p1','s1'), true),
  ].filter(Boolean).join('') || '<div class="history-empty">Dati insufficienti.</div>';
}

// ── NAME / TABS ──
function openNameModal() { document.getElementById('name-modal').classList.add('open'); setTimeout(() => document.getElementById('name-input').focus(), 100); }
function saveName() {
  const v = document.getElementById('name-input').value.trim();
  if (!v) return;
  localStorage.setItem(KEY_NAME, v);
  document.getElementById('name-badge').textContent = v;
  document.getElementById('name-modal').classList.remove('open');
  currentSess = 1; currentStep = 0;
  const d = getData();
  const nums = Object.keys(d).map(Number).filter(n => !isNaN(n));
  if (nums.length) currentSess = Math.max(...nums);
  renderStepDots(); renderStep(); renderHistory(); renderProgress();
}
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => { el.classList.toggle('active', ['log','history','progress'][i] === t); });
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  if (t === 'history') renderHistory();
  if (t === 'progress') renderProgress();
}

init();
</script>
