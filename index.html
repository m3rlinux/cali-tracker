<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cali Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0c;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #272727;
  --border2: #333;
  --text: #eeebe6;
  --muted: #7a7672;
  --muted2: #444;
  --accent: #c8f060;
  --accent2: #8fb840;
  --teal: #4dd9a0;
  --coral: #f07060;
  --amber: #f0b840;
  --purple: #b090f0;
  --blue: #60a8f0;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; max-width: 480px; margin: 0 auto; }

.app-header { padding: 18px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.app-title { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }
.name-badge { font-size: 12px; color: var(--muted); font-family: var(--mono); cursor: pointer; border: 1px solid var(--border2); border-radius: 20px; padding: 4px 10px; }

.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.page { display: none; }
.page.active { display: block; }

/* SESSION BAR */
.sess-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sess-info { display: flex; align-items: baseline; gap: 8px; }
.sess-num-big { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--accent); }
.sess-date-sm { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sess-nav { display: flex; gap: 6px; }
.sess-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.sess-btn:active { background: var(--surface2); }

/* STEP */
.step-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 0; }
.step-label { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.step-dots { display: flex; gap: 5px; }
.step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); transition: background .2s; }
.step-dot.active { background: var(--accent); }
.step-dot.done { background: var(--muted2); }

.step-nav { display: flex; align-items: center; padding: 10px 16px 14px; gap: 10px; }
.nav-btn { flex: 1; padding: 11px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); border-radius: var(--r); font-size: 13px; font-family: var(--sans); cursor: pointer; }
.nav-btn:active { background: var(--surface2); }
.nav-btn:disabled { opacity: .3; cursor: default; }
.save-btn { flex: 2; padding: 11px; background: var(--accent); color: #0c0c0c; border: none; border-radius: var(--r); font-size: 14px; font-weight: 600; font-family: var(--sans); cursor: pointer; }
.save-btn:active { background: var(--accent2); }

.step-content { padding: 14px 16px 0; }

/* VARIANT SELECT */
.variant-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.variant-select-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
.variant-select { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: var(--sans); color: var(--text); cursor: pointer; appearance: none; -webkit-appearance: none; }
.variant-select:focus { outline: none; }
.variant-select.col-purple { border-color: var(--purple); color: var(--purple); }
.variant-select.col-teal   { border-color: var(--teal);   color: var(--teal);   }
.variant-select.col-coral  { border-color: var(--coral);  color: var(--coral);  }
.variant-select.col-blue   { border-color: var(--blue);   color: var(--blue);   }
.variant-select.col-amber  { border-color: var(--amber);  color: var(--amber);  }
.variant-prev-sm { font-size: 10px; color: var(--muted2); font-family: var(--mono); flex-shrink: 0; }

/* VERTICALE */
.vert-max-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.vert-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.vc-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.vc-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 8px; font-size: 26px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; }
.vc-input::-webkit-inner-spin-button, .vc-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.vc-input:focus { outline: none; border-color: var(--purple); }
.vc-unit { font-size: 10px; color: var(--muted2); font-family: var(--mono); text-align: center; margin-top: 4px; }
.vc-prev { font-size: 10px; color: var(--muted); font-family: var(--mono); text-align: center; margin-top: 3px; }

.vert-work-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 4px; }
.vert-work-head { padding: 9px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.vert-work-title { font-size: 12px; font-weight: 500; color: var(--purple); }
.vert-target-badge { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.vert-sets { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.vert-set-row { display: flex; align-items: center; gap: 8px; }
.vert-set-label { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; }
.vert-set-input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; }
.vert-set-input::-webkit-inner-spin-button, .vert-set-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.vert-set-input:focus { outline: none; border-color: var(--purple); }
.vert-set-unit { font-size: 11px; color: var(--muted2); font-family: var(--mono); width: 20px; }
.vert-total-bar { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.vert-total-label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.vert-total-val { font-family: var(--mono); font-size: 14px; font-weight: 500; }
.vert-total-target { font-size: 10px; color: var(--muted2); font-family: var(--mono); }

/* PAIR */
.pair-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.pair-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pair-title { font-size: 14px; font-weight: 600; }
.pair-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: auto; }

.ex-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
.ex-head { padding: 9px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.ex-color-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.ex-name { font-size: 12px; font-weight: 500; }
.ex-tag { font-size: 10px; font-family: var(--mono); color: var(--muted); background: var(--surface2); border-radius: 4px; padding: 2px 6px; margin-left: auto; }

/* TIME BLOCK — hold max + target dentro ex-block */
.ex-time-pr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.ex-vc-card { background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 10px; }
.ex-vc-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.ex-vc-input { width: 100%; background: transparent; border: none; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; outline: none; }
.ex-vc-input::-webkit-inner-spin-button, .ex-vc-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.ex-vc-unit { font-size: 10px; color: var(--muted2); font-family: var(--mono); text-align: center; margin-top: 2px; }
.ex-vc-prev { font-size: 10px; color: var(--muted); font-family: var(--mono); text-align: center; margin-top: 2px; }
.ex-vc-target-val { font-size: 22px; font-family: var(--mono); font-weight: 500; text-align: center; }

/* TIME SETS */
.time-sets { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.time-set-row { display: flex; align-items: center; gap: 8px; }
.time-set-label { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; }
.time-set-input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; }
.time-set-input::-webkit-inner-spin-button, .time-set-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.time-set-input:focus { outline: none; border-color: var(--purple); }
.time-set-unit { font-size: 11px; color: var(--muted2); font-family: var(--mono); width: 20px; }
.time-total-bar { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.time-total-label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.time-total-val { font-family: var(--mono); font-size: 14px; font-weight: 500; }
.time-total-target { font-size: 10px; color: var(--muted2); font-family: var(--mono); }

.sets-grid { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.set-row { display: flex; align-items: center; gap: 8px; }
.set-label { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; }
.set-inputs { display: flex; gap: 6px; flex: 1; }
.si-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.si-lbl { font-size: 9px; color: var(--muted2); font-family: var(--mono); text-align: center; text-transform: uppercase; letter-spacing: .04em; }
.si-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 4px; font-size: 22px; font-family: var(--mono); font-weight: 500; color: var(--text); text-align: center; -moz-appearance: textfield; }
.si-input::-webkit-inner-spin-button, .si-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.si-input.reps:focus { border-color: var(--teal); }
.si-input.cluster:focus { border-color: var(--amber); }
.set-prev { font-family: var(--mono); font-size: 10px; color: var(--muted2); white-space: nowrap; min-width: 44px; text-align: right; }
.cluster-hint { font-size: 10px; color: var(--amber); font-family: var(--mono); text-align: center; padding: 6px 12px 10px; opacity: .7; }

/* HISTORY */
#page-history { padding: 16px; }
.history-empty { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 13px; line-height: 1.9; }
.history-sess { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.history-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.history-sess-num { font-family: var(--mono); font-size: 13px; color: var(--accent); }
.history-meta { display: flex; align-items: center; gap: 10px; }
.history-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.delete-btn { background: none; border: 1px solid var(--border2); border-radius: 6px; color: var(--muted); font-size: 11px; padding: 3px 7px; cursor: pointer; }
.delete-btn:active { background: var(--coral); color: #0c0c0c; border-color: var(--coral); }
.history-body { padding: 10px 14px; display: none; border-top: 1px solid var(--border); }
.history-body.open { display: block; }
.history-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.history-row:last-child { border-bottom: none; }
.history-key { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.history-val { font-family: var(--mono); font-weight: 500; font-size: 12px; display: flex; align-items: center; gap: 4px; }
.delta-pos { color: var(--teal); font-size: 10px; }
.delta-neg { color: var(--coral); font-size: 10px; }

/* PROGRESS */
#page-progress { padding: 16px; }
.prog-section { margin-bottom: 24px; }
.prog-title { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.prog-chart-wrap { padding-bottom: 22px; }
.prog-chart { height: 80px; display: flex; align-items: flex-end; gap: 4px; }
.prog-bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 4px; position: relative; }
.prog-bar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); font-family: var(--mono); }
.prog-val { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 9px; font-family: var(--mono); font-weight: 500; white-space: nowrap; }
.prog-stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 6px; }
.prog-stat { background: var(--surface); border-radius: 8px; padding: 10px; text-align: center; }
.prog-stat-val { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.prog-stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
.modal-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; font-size: 16px; color: var(--text); font-family: var(--sans); }
.modal-input:focus { outline: none; border-color: var(--accent); }
.modal-btn { width: 100%; margin-top: 12px; padding: 12px; background: var(--accent); color: #0c0c0c; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); }

.toast { text-align: center; font-size: 12px; color: var(--accent); font-family: var(--mono); padding: 8px; opacity: 0; transition: opacity .3s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">Cali Tracker <span id="version" style="color:var(--muted2);font-size:10px;letter-spacing:.04em"></span></div>
  <div class="name-badge" id="name-badge" onclick="openNameModal()">— imposta nome</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('log')">Inserisci</div>
  <div class="tab" onclick="switchTab('history')">Storico</div>
  <div class="tab" onclick="switchTab('progress')">Progressi</div>
</div>

<div class="page active" id="page-log">
  <div class="sess-bar">
    <div class="sess-info">
      <div class="sess-num-big" id="sess-num">1</div>
      <div class="sess-date-sm" id="sess-date">—</div>
    </div>
    <div class="sess-nav">
      <button class="sess-btn" onclick="changeSess(-1)">‹</button>
      <button class="sess-btn" onclick="changeSess(1)">›</button>
    </div>
  </div>
  <div class="step-bar">
    <div class="step-label" id="step-label">Verticale</div>
    <div class="step-dots" id="step-dots"></div>
  </div>
  <div class="step-content" id="step-content"></div>
  <div class="step-nav">
    <button class="nav-btn" id="btn-prev" onclick="goStep(-1)">‹ Indietro</button>
    <button class="nav-btn" id="btn-next" onclick="goStep(1)">Avanti ›</button>
    <button class="save-btn" id="btn-save" onclick="saveSession()" style="display:none">Salva ✓</button>
  </div>
  <div class="toast" id="toast">✓ Sessione salvata</div>
</div>

<div class="page" id="page-history">
  <div id="history-list"><div class="history-empty">Nessuna sessione ancora.</div></div>
</div>

<div class="page" id="page-progress">
  <div id="progress-content"><div class="history-empty">Inserisci almeno 2 sessioni<br>per vedere i progressi.</div></div>
</div>

<div class="modal-overlay" id="name-modal">
  <div class="modal">
    <div class="modal-title">Come ti chiami?</div>
    <input class="modal-input" id="name-input" type="text" placeholder="Il tuo nome" maxlength="30">
    <button class="modal-btn" onclick="saveName()">Salva</button>
  </div>
</div>

<script>
const VERSION = '1.9';
const KEY_NAME = 'cali_name';
const MAX_VERT_SETS = 6;
const VERT_TARGET_LOW = 50;
const VERT_TARGET_HIGH = 60;
const TIME_TARGET_LOW = 50;
const TIME_TARGET_HIGH = 60;
const TIME_SETS = 3; // set di lavoro per esercizi isometrici nelle coppie

function sessKey() { return 'cali_sessions_' + (getName().toLowerCase().replace(/\s+/g,'_') || 'default'); }
function getData() { try { return JSON.parse(localStorage.getItem(sessKey())) || {}; } catch(e) { return {}; } }
function saveData(d) { localStorage.setItem(sessKey(), JSON.stringify(d)); }
function getName() { return localStorage.getItem(KEY_NAME) || ''; }

let currentSess = 1;
let currentStep = 0;
const TOTAL_STEPS = 5;

const STATION_CATEGORY = {
  s_vert: 'handstand',
  s5: 'spinta_orizzontale',
  s1: 'tirata_orizzontale',
  s3: 'tirata_verticale',
  s6: 'gamba_anteriore',
  s8: 'gamba_posteriore',
  s4: 'core',
  s2: 'catena_posteriore',
  s7: 'spinta_verticale'
};

const PAIRS = [
  null,
  { id:'p1', label:'P1', colorToken:'teal', sets:3, exercises:[
    { key:'s5', name:'S5 — Spinta orizzontale', colorToken:'teal', tag:'spinta orizz.' },
    { key:'s1', name:'S1 — Tirata orizzontale', colorToken:'teal', tag:'tirata orizz.' }
  ]},
  { id:'p2', label:'P2', colorToken:'coral', sets:3, exercises:[
    { key:'s7', name:'S7 — Spinta verticale', colorToken:'amber', tag:'spinta vert.' },
    { key:'s3', name:'S3 — Tirata verticale', colorToken:'coral', tag:'tirata vert.' }
  ]},
  { id:'p3', label:'P3', colorToken:'blue', sets:2, exercises:[
    { key:'s6', name:'S6 — Gamba anteriore', colorToken:'blue', tag:'unilaterale' },
    { key:'s8', name:'S8 — Gamba posteriore', colorToken:'blue', tag:'catena post.' }
  ]},
  { id:'p4', label:'P4', colorToken:'purple', sets:2, exercises:[
    { key:'s4', name:'S4 — Core', colorToken:'purple', tag:'core' },
    { key:'s2', name:'S2 — Catena posteriore', colorToken:'purple', tag:'catena post.' }
  ]}
];

function cssVar(token) { return `var(--${token})`; }

let EXERCISES = {};

function getVariants(stationKey) {
  const cat = STATION_CATEGORY[stationKey];
  if (!cat || !EXERCISES[cat]) return [];
  return EXERCISES[cat].variants || [];
}

function getMetric(stationKey, variant) {
  const cat = STATION_CATEGORY[stationKey];
  if (!cat || !EXERCISES[cat] || !variant) return 'reps';
  return EXERCISES[cat].metrics?.[variant] || 'reps';
}

// ── LOAD EXERCISES ──
async function loadExercises() {
  document.getElementById("step-content").innerHTML = "<div style=\"padding:12px;font-family:var(--mono);font-size:11px;color:var(--muted)\">Caricamento exercises.json…</div>";
  try {
    const res = await fetch('exercises.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    EXERCISES = await res.json();
  } catch(e) {
    console.warn("exercises.json fetch failed:", e.message);
    EXERCISES = {};
  }
}

// ── INIT ──
async function init() {
  const name = getName();
  if (!name) openNameModal();
  else document.getElementById('name-badge').textContent = name;
  await loadExercises();
  const data = getData();
  const nums = Object.keys(data).map(Number).filter(n => !isNaN(n));
  if (nums.length) currentSess = Math.max(...nums);
  renderStepDots();
  renderStep();
  renderHistory();
  renderProgress();
  document.getElementById('version').textContent = 'v' + VERSION;
}

// ── SESSION NAV ──
function changeSess(d) {
  collectStep(currentStep);
  const next = currentSess + d;
  if (next < 1 || next > 30) return;
  currentSess = next;
  currentStep = 0;
  renderStepDots();
  renderStep();
}

// ── STEP NAV ──
function renderStepDots() {
  document.getElementById('step-dots').innerHTML = Array.from({length: TOTAL_STEPS}, (_, i) => {
    const cls = i === currentStep ? 'active' : i < currentStep ? 'done' : '';
    return `<div class="step-dot ${cls}"></div>`;
  }).join('');
}

function goStep(d) {
  collectStep(currentStep);
  currentStep = Math.max(0, Math.min(TOTAL_STEPS - 1, currentStep + d));
  renderStepDots();
  renderStep();
}

function renderStep() {
  const labels = ['Verticale', 'P1 — Spinta + Tirata orizz.', 'P2 — Spinta vert. + Tirata vert.', 'P3 — Gambe', 'P4 — Core + Catena post.'];
  document.getElementById('step-label').textContent = labels[currentStep];
  document.getElementById('btn-prev').disabled = currentStep === 0;
  document.getElementById('btn-next').style.display = currentStep < TOTAL_STEPS - 1 ? '' : 'none';
  document.getElementById('btn-save').style.display = currentStep === TOTAL_STEPS - 1 ? '' : 'none';
  const data = getData();
  const s = data[currentSess] || {};
  const prev = data[currentSess - 1] || {};
  document.getElementById('sess-num').textContent = currentSess;
  document.getElementById('sess-date').textContent = s.date || '—';
  if (currentStep === 0) renderVertStep(s, prev);
  else renderPairStep(currentStep, s, prev);
}

// ── VARIANT SELECT HTML ──
function variantChipsHTML(stationKey, selectedVariant, prevVariant, colorToken) {
  const variants = getVariants(stationKey);
  if (!variants.length) return '';
  const colClass = colorToken ? `col-${colorToken}` : 'col-purple';
  const hasSelection = selectedVariant && variants.includes(selectedVariant);
  const options = [`<option value="">— scegli —</option>`]
    .concat(variants.map(v => `<option value="${v}" ${selectedVariant === v ? 'selected' : ''}>${v}</option>`))
    .join('');
  return `<div class="variant-row">
    <div class="variant-select-label">Eserc.</div>
    <select class="variant-select ${hasSelection ? colClass : ''}" data-station="${stationKey}" data-color="${colorToken||'purple'}" onchange="onVariantChange(this)">
      ${options}
    </select>
    ${prevVariant ? `<div class="variant-prev-sm">↑${prevVariant}</div>` : ''}
  </div>`;
}

function onVariantChange(el) {
  const color = el.dataset.color;
  el.className = `variant-select${el.value ? ' col-'+color : ''}`;
  // re-render the sets block below this variant select
  const stationKey = el.dataset.station;
  const metric = getMetric(stationKey, el.value);
  const exBlock = el.closest('.ex-block');
  if (!exBlock) return;
  const data = getData();
  const s = data[currentSess] || {};
  const prev = data[currentSess - 1] || {};
  const pair = PAIRS[currentStep];
  if (!pair) return;
  const ex = pair.exercises.find(e => e.key === stationKey);
  if (!ex) return;
  const exData = s[pair.id]?.[ex.key] || {};
  const prevExData = prev[pair.id]?.[ex.key] || {};
  // replace sets + totale inside the ex-block
  const oldPr = exBlock.querySelector('.ex-time-pr');
  const oldSets = exBlock.querySelector('.time-sets, .sets-grid');
  const oldTotal = exBlock.querySelector('.time-total-bar');
  const oldCluster = exBlock.querySelector('.cluster-hint');
  if (oldPr) oldPr.remove();
  if (oldSets) oldSets.remove();
  if (oldTotal) oldTotal.remove();
  if (oldCluster) oldCluster.remove();
  const fragment = document.createElement('div');
  if (metric === 'time') {
    fragment.innerHTML = timeSetsHTML(stationKey, ex, exData, prevExData, pair.sets);
  } else {
    fragment.innerHTML = repsSetsHTML(ex, exData, prevExData, pair.sets);
  }
  while (fragment.firstChild) exBlock.appendChild(fragment.firstChild);
}

// ── VERTICALE STEP ──
function renderVertStep(s, prev) {
  const holdMax = s.hold_max ?? '';
  const prevMax = prev.hold_max != null ? `prec. ${prev.hold_max}"` : '';
  const holdSets = s.hold_sets || [];
  const prevHoldSets = prev.hold_sets || [];
  const targetPerSet = holdMax !== '' ? Math.round(holdMax * 0.65) : null;
  const targetBadge = targetPerSet ? `target ~${targetPerSet}" per set` : 'inserisci hold max';
  const setRows = Array.from({length: MAX_VERT_SETS}, (_, i) => {
    const val = holdSets[i] ?? '';
    const prevVal = prevHoldSets[i] != null ? `${prevHoldSets[i]}"` : '';
    return `<div class="vert-set-row">
      <div class="vert-set-label">S${i+1}</div>
      <input class="vert-set-input" id="vset-${i}" type="number" inputmode="numeric" min="0" placeholder="—" value="${val}" oninput="updateVertTotal()">
      <div class="vert-set-unit">"</div>
      <div class="set-prev" style="min-width:32px;text-align:right;font-size:10px;color:var(--muted2);font-family:var(--mono)">${prevVal ? `↑${prevVal}` : ''}</div>
    </div>`;
  }).join('');
  const currentTotal = holdSets.reduce((a, v) => a + (v || 0), 0);
  const totalColor = currentTotal >= VERT_TARGET_LOW ? 'var(--teal)' : 'var(--amber)';
  document.getElementById('step-content').innerHTML = `
    ${variantChipsHTML('s_vert', s.s_vert_variant || '', prev.s_vert_variant || '', 'purple')}
    <div class="vert-max-row">
      <div class="vert-card">
        <div class="vc-label">Hold max (PR)</div>
        <input class="vc-input" id="hold_max" type="number" inputmode="numeric" min="0" placeholder="—" value="${holdMax}" oninput="updateVertTarget()">
        <div class="vc-unit">secondi</div>
        ${prevMax ? `<div class="vc-prev">${prevMax}</div>` : ''}
      </div>
      <div class="vert-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <div class="vc-label">Target per set</div>
        <div id="target-display" style="font-family:var(--mono);font-size:22px;font-weight:500;color:var(--purple)">${targetPerSet ? targetPerSet + '"' : '—'}</div>
        <div class="vc-unit">65% del max</div>
      </div>
    </div>
    <div class="vert-work-block">
      <div class="vert-work-head">
        <div class="vert-work-title">Set di lavoro</div>
        <div class="vert-target-badge" id="target-badge">${targetBadge}</div>
      </div>
      <div class="vert-sets" id="vert-sets-grid">${setRows}</div>
      <div class="vert-total-bar">
        <div class="vert-total-label">Totale</div>
        <div>
          <span class="vert-total-val" id="vert-total" style="color:${totalColor}">${currentTotal}"</span>
          <span class="vert-total-target"> / ${VERT_TARGET_LOW}–${VERT_TARGET_HIGH}"</span>
        </div>
      </div>
    </div>
  `;
}

function updateVertTarget() {
  const max = parseInt(document.getElementById('hold_max')?.value) || 0;
  const target = max > 0 ? Math.round(max * 0.65) : null;
  const disp = document.getElementById('target-display');
  const badge = document.getElementById('target-badge');
  if (disp) disp.textContent = target ? target + '"' : '—';
  if (badge) badge.textContent = target ? `target ~${target}" per set` : 'inserisci hold max';
}

function updateVertTotal() {
  let total = 0;
  for (let i = 0; i < MAX_VERT_SETS; i++) {
    const v = parseInt(document.getElementById(`vset-${i}`)?.value) || 0;
    total += v;
  }
  const el = document.getElementById('vert-total');
  if (!el) return;
  el.textContent = total + '"';
  el.style.color = total >= VERT_TARGET_LOW ? 'var(--teal)' : 'var(--amber)';
}

// ── TIME SETS HTML (per esercizi isometrici nelle coppie) ──
function timeSetsHTML(stationKey, ex, exData, prevExData, numSets) {
  const holdMax = exData.hold_max ?? '';
  const prevMax = prevExData.hold_max != null ? `prec. ${prevExData.hold_max}"` : '';
  const targetPerSet = holdMax !== '' ? Math.round(Number(holdMax) * 0.65) : null;
  const sets = exData.sets || [];
  const prevSets = prevExData.sets || [];
  const currentTotal = sets.reduce((a, v) => a + (v?.[0] || 0), 0);
  const totalColor = currentTotal >= TIME_TARGET_LOW ? 'var(--teal)' : 'var(--amber)';

  const prBlock = `<div class="ex-time-pr">
    <div class="ex-vc-card">
      <div class="ex-vc-label">Hold max (PR)</div>
      <input class="ex-vc-input" data-pr="${stationKey}" type="number" inputmode="numeric" min="0" placeholder="—" value="${holdMax}" oninput="updateTimeTarget('${stationKey}')">
      <div class="ex-vc-unit">secondi</div>
      ${prevMax ? `<div class="ex-vc-prev">${prevMax}</div>` : ''}
    </div>
    <div class="ex-vc-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <div class="ex-vc-label">Target per set</div>
      <div id="time-target-${stationKey}" class="ex-vc-target-val" style="color:var(--purple)">${targetPerSet ? targetPerSet + '"' : '—'}</div>
      <div class="ex-vc-unit">65% del max</div>
    </div>
  </div>`;

  const setRows = Array.from({length: MAX_VERT_SETS}, (_, i) => {
    const val = sets[i]?.[0] ?? '';
    const prevVal = prevSets[i]?.[0] != null ? `${prevSets[i][0]}"` : '';
    return `<div class="time-set-row">
      <div class="time-set-label">S${i+1}</div>
      <input class="time-set-input" data-ex="${stationKey}" data-set="${i}" type="number" inputmode="numeric" min="0" placeholder="—" value="${val}" oninput="updateTimeTotal('${stationKey}')">
      <div class="time-set-unit">"</div>
      <div class="set-prev" style="min-width:32px;text-align:right;font-size:10px;color:var(--muted2);font-family:var(--mono)">${prevVal ? `↑${prevVal}` : ''}</div>
    </div>`;
  }).join('');

  return `${prBlock}
  <div class="time-sets" id="time-sets-${stationKey}">${setRows}</div>
  <div class="time-total-bar" id="time-total-bar-${stationKey}">
    <div class="time-total-label">Totale</div>
    <div>
      <span class="time-total-val" id="time-total-${stationKey}" style="color:${totalColor}">${currentTotal}"</span>
      <span class="time-total-target"> / ${TIME_TARGET_LOW}–${TIME_TARGET_HIGH}"</span>
    </div>
  </div>`;
}

function updateTimeTarget(stationKey) {
  const input = document.querySelector(`[data-pr="${stationKey}"]`);
  const max = parseInt(input?.value) || 0;
  const target = max > 0 ? Math.round(max * 0.65) : null;
  const el = document.getElementById(`time-target-${stationKey}`);
  if (el) el.textContent = target ? target + '"' : '—';
}

function updateTimeTotal(stationKey) {
  let total = 0;
  for (let i = 0; i < MAX_VERT_SETS; i++) {
    const v = parseInt(document.querySelector(`.time-set-input[data-ex="${stationKey}"][data-set="${i}"]`)?.value) || 0;
    total += v;
  }
  const el = document.getElementById(`time-total-${stationKey}`);
  if (!el) return;
  el.textContent = total + '"';
  el.style.color = total >= TIME_TARGET_LOW ? 'var(--teal)' : 'var(--amber)';
}

// ── REPS SETS HTML ──
function repsSetsHTML(ex, exData, prevExData, numSets) {
  const sets = exData.sets || [];
  const prevSets = prevExData.sets || [];
  const setRows = Array.from({length: numSets}, (_, i) => {
    const f = sets[i]?.[0] ?? '';
    const c = sets[i]?.[1] ?? '';
    const pf = prevSets[i]?.[0];
    const pc = prevSets[i]?.[1];
    const prevStr = pf != null ? (pc ? `${pf}+${pc}` : `${pf}`) : '';
    return `<div class="set-row">
      <div class="set-label">S${i+1}</div>
      <div class="set-inputs">
        <div class="si-wrap">
          <div class="si-lbl">reps</div>
          <input class="si-input reps" data-ex="${ex.key}" data-set="${i}" data-type="f" type="number" inputmode="numeric" min="0" placeholder="—" value="${f}">
        </div>
        <div class="si-wrap">
          <div class="si-lbl">cluster</div>
          <input class="si-input cluster" data-ex="${ex.key}" data-set="${i}" data-type="c" type="number" inputmode="numeric" min="0" placeholder="—" value="${c}">
        </div>
      </div>
      <div class="set-prev">${prevStr ? `↑${prevStr}` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="sets-grid">${setRows}</div>
  <div class="cluster-hint">cluster dopo 5"–8" di riposo</div>`;
}

// ── PAIR STEP ──
function renderPairStep(step, s, prev) {
  const pair = PAIRS[step];
  const pairData = s[pair.id] || {};
  const prevPair = prev[pair.id] || {};

  const exHTML = pair.exercises.map(ex => {
    const exData = pairData[ex.key] || {};
    const prevExData = prevPair[ex.key] || {};
    const variantsHTML = variantChipsHTML(ex.key, exData.variant || '', prevExData.variant || '', ex.colorToken);
    const metric = getMetric(ex.key, exData.variant || '');
    const setsHTML = metric === 'time'
      ? timeSetsHTML(ex.key, ex, exData, prevExData, pair.sets)
      : repsSetsHTML(ex, exData, prevExData, pair.sets);

    return `<div class="ex-block">
      <div class="ex-head">
        <div class="ex-color-dot" style="background:${cssVar(ex.colorToken)}"></div>
        <div class="ex-name">${ex.name}</div>
      </div>
      ${variantsHTML || ''}
      ${setsHTML}
    </div>`;
  }).join('');

  const hasTimeEx = pair.exercises.some(ex => {
    const cat = STATION_CATEGORY[ex.key];
    const variant = s[pair.id]?.[ex.key]?.variant || '';
    return getMetric(ex.key, variant) === 'time';
  });
  const setsLabel = hasTimeEx ? MAX_VERT_SETS : pair.sets;

  document.getElementById('step-content').innerHTML = `
    <div class="pair-header">
      <div class="pair-dot" style="background:${cssVar(pair.colorToken)}"></div>
      <div class="pair-title" style="color:${cssVar(pair.colorToken)}">${pair.label}</div>
      <div class="pair-sub">${setsLabel} set · 30"</div>
    </div>
    ${exHTML}
  `;
}

// ── COLLECT ──
function collectStep(step) {
  const data = getData();
  if (!data[currentSess]) data[currentSess] = {};
  const s = data[currentSess];

  if (step === 0) {
    const hm = document.getElementById('hold_max')?.value;
    if (hm !== '' && hm != null) s.hold_max = parseInt(hm) || 0;
    const holdSets = [];
    for (let i = 0; i < MAX_VERT_SETS; i++) {
      const v = document.getElementById(`vset-${i}`)?.value;
      holdSets.push(v !== '' && v != null ? parseInt(v) || 0 : null);
    }
    s.hold_sets = holdSets;
    const selVariant = document.querySelector('.variant-select[data-station="s_vert"]');
    if (selVariant?.value) s.s_vert_variant = selVariant.value;
  } else {
    const pair = PAIRS[step];
    if (!s[pair.id]) s[pair.id] = {};
    pair.exercises.forEach(ex => {
      if (!s[pair.id][ex.key]) s[pair.id][ex.key] = {};
      const exObj = s[pair.id][ex.key];
      const selVariant = document.querySelector(`.variant-select[data-station="${ex.key}"]`);
      if (selVariant?.value) exObj.variant = selVariant.value;

      const metric = getMetric(ex.key, exObj.variant || '');
      const sets = [];

      if (metric === 'time') {
        // salva hold_max PR
        const prInput = document.querySelector(`[data-pr="${ex.key}"]`);
        if (prInput?.value !== '') exObj.hold_max = parseInt(prInput.value) || 0;
        // salva sets come [secondi, null] — sempre MAX_VERT_SETS slot
        for (let i = 0; i < MAX_VERT_SETS; i++) {
          const ti = document.querySelector(`.time-set-input[data-ex="${ex.key}"][data-set="${i}"]`);
          const t = ti?.value !== '' ? parseInt(ti.value) : null;
          sets.push([t, null]);
        }
      } else {
        for (let i = 0; i < pair.sets; i++) {
          const fi = document.querySelector(`[data-ex="${ex.key}"][data-set="${i}"][data-type="f"]`);
          const ci = document.querySelector(`[data-ex="${ex.key}"][data-set="${i}"][data-type="c"]`);
          const f = fi?.value !== '' ? parseInt(fi.value) : null;
          const c = ci?.value !== '' ? parseInt(ci.value) : null;
          sets.push([f, c]);
        }
      }
      exObj.sets = sets;
    });
  }
  saveData(data);
  document.getElementById('sess-date').textContent = getData()[currentSess]?.date || '—';
}

function saveSession() {
  collectStep(currentStep);
  const data = getData();
  if (!data[currentSess]) data[currentSess] = {};
  data[currentSess].date = new Date().toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'2-digit' });
  saveData(data);
  document.getElementById('sess-date').textContent = data[currentSess].date;
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
  renderHistory();
  renderProgress();
}

// ── HISTORY ──
function renderHistory() {
  const data = getData();
  const list = document.getElementById('history-list');
  const sessions = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a,b) => b-a);
  if (!sessions.length) { list.innerHTML = '<div class="history-empty">Nessuna sessione ancora.</div>'; return; }

  function delta(val, prevVal, invertPositive) {
    if (val == null || prevVal == null) return '';
    const d = val - prevVal;
    if (d === 0) return '';
    const better = invertPositive ? d < 0 : d > 0;
    return `<span class="${better ? 'delta-pos' : 'delta-neg'}">${d > 0 ? '+' : ''}${d}</span>`;
  }
  function totExReps(exObj) { return exObj?.sets?.reduce((a,[f,c]) => a+(f||0)+(c||0), 0) ?? null; }
  function totExTime(exObj) { return exObj?.sets?.reduce((a,[t]) => a+(t||0), 0) ?? null; }
  function clEx(exObj) { return exObj?.sets?.reduce((a,[f,c]) => a+(c||0), 0) ?? null; }

  list.innerHTML = sessions.map(n => {
    const s = data[n], prev = data[n-1] || {};
    const rows = [];

    if (s.hold_max != null) rows.push(`<div class="history-row"><span class="history-key">Hold max</span><span class="history-val">${s.hold_max}" ${delta(s.hold_max, prev.hold_max, false)}</span></div>`);
    if (s.s_vert_variant) rows.push(`<div class="history-row"><span class="history-key">Verticale</span><span class="history-val">${s.s_vert_variant}</span></div>`);
    if (s.hold_sets) {
      const tot = s.hold_sets.filter(v => v != null).reduce((a,v) => a+(v||0), 0);
      const prevTot = prev.hold_sets ? prev.hold_sets.filter(v => v != null).reduce((a,v) => a+(v||0), 0) : null;
      if (tot > 0) rows.push(`<div class="history-row"><span class="history-key">Hold lavoro tot.</span><span class="history-val">${tot}" ${delta(tot, prevTot, false)}</span></div>`);
    }

    [['p1','s5'],['p1','s1'],['p2','s7'],['p2','s3'],['p3','s6'],['p3','s8'],['p4','s4'],['p4','s2']].forEach(([p,k]) => {
      const exObj = s[p]?.[k], prevExObj = prev[p]?.[k];
      if (!exObj?.sets) return;
      const metric = getMetric(k, exObj.variant || '');
      const vLabel = exObj.variant ? ` (${exObj.variant})` : '';
      if (metric === 'time') {
        const tot = totExTime(exObj);
        const prevTot = totExTime(prevExObj);
        if (exObj.hold_max != null) rows.push(`<div class="history-row"><span class="history-key">${k.toUpperCase()} PR${vLabel}</span><span class="history-val">${exObj.hold_max}" ${delta(exObj.hold_max, prevExObj?.hold_max, false)}</span></div>`);
        if (tot != null && tot > 0) rows.push(`<div class="history-row"><span class="history-key">${k.toUpperCase()} tot.</span><span class="history-val">${tot}" ${delta(tot, prevTot, false)}</span></div>`);
      } else {
        const tot = totExReps(exObj), cl = clEx(exObj);
        const prevTot = totExReps(prevExObj), prevCl = clEx(prevExObj);
        rows.push(`<div class="history-row"><span class="history-key">${k.toUpperCase()}${vLabel}</span><span class="history-val">${tot} rep ${delta(tot, prevTot, false)}</span></div>`);
        if (cl > 0 || (prevCl != null && prevCl > 0)) rows.push(`<div class="history-row"><span class="history-key">${k.toUpperCase()} cluster</span><span class="history-val">${cl} ${delta(cl, prevCl, true)}</span></div>`);
      }
    });

    return `<div class="history-sess">
      <div class="history-head" onclick="toggleHistory(this)">
        <span class="history-sess-num">Sessione ${n}</span>
        <div class="history-meta">
          <span class="history-date">${s.date||'—'}</span>
          <button class="delete-btn" onclick="deleteSession(event,${n})">✕</button>
        </div>
      </div>
      <div class="history-body">${rows.join('')||'<div style="font-size:12px;color:var(--muted);padding:4px 0">Nessun dato</div>'}</div>
    </div>`;
  }).join('');
}

function toggleHistory(el) { el.nextElementSibling.classList.toggle('open'); }
function deleteSession(e, n) {
  e.stopPropagation();
  if (!confirm(`Cancellare la sessione ${n}?`)) return;
  const data = getData(); delete data[n]; saveData(data);
  renderHistory(); renderProgress();
}

// ── PROGRESS ──
function renderProgress() {
  const data = getData();
  const sessions = Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a,b) => a-b);
  const cont = document.getElementById('progress-content');
  if (sessions.length < 2) { cont.innerHTML = '<div class="history-empty">Inserisci almeno 2 sessioni<br>per vedere i progressi.</div>'; return; }

  function chartHTML(title, color, valFn, invertTrend) {
    const vals = sessions.map(n => valFn(data[n]));
    if (vals.every(v => v == null)) return '';
    const defined = vals.filter(v => v != null);
    const max = Math.max(...defined), min = Math.min(...defined);
    const first = defined[0], last = defined[defined.length-1];
    const trend = last - first;
    const tLabel = trend === 0 ? '=' : (trend > 0 ? '+'+trend : ''+trend);
    const tColor = trend === 0 ? 'var(--muted)' : (invertTrend ? (trend < 0 ? 'var(--teal)' : 'var(--coral)') : (trend > 0 ? 'var(--teal)' : 'var(--coral)'));
    const bars = sessions.map((n,i) => {
      const v = vals[i];
      if (v == null) return `<div class="prog-bar" style="background:var(--border);height:4px"><div class="prog-bar-label">S${n}</div></div>`;
      const h = max === min ? 50 : ((v - min) / (max - min)) * 60 + 10;
      return `<div class="prog-bar" style="background:${color};height:${h}px"><div class="prog-val" style="color:${color}">${v}</div><div class="prog-bar-label">S${n}</div></div>`;
    }).join('');
    return `<div class="prog-section">
      <div class="prog-title">${title}</div>
      <div class="prog-chart-wrap"><div class="prog-chart">${bars}</div></div>
      <div class="prog-stat-row">
        <div class="prog-stat"><div class="prog-stat-val" style="color:${color}">${first}</div><div class="prog-stat-lbl">inizio</div></div>
        <div class="prog-stat"><div class="prog-stat-val" style="color:${color}">${last}</div><div class="prog-stat-lbl">attuale</div></div>
        <div class="prog-stat"><div class="prog-stat-val" style="color:${tColor}">${tLabel}</div><div class="prog-stat-lbl">trend</div></div>
      </div>
    </div>`;
  }

  function totExReps(s, p, k) { return s[p]?.[k]?.sets?.reduce((a,[f,c])=>a+(f||0)+(c||0),0) ?? null; }
  function totExTime(s, p, k) { return s[p]?.[k]?.sets?.reduce((a,[t])=>a+(t||0),0) ?? null; }
  function clPct(s, p, k) {
    const e = s[p]?.[k]; if (!e?.sets) return null;
    const tot = e.sets.reduce((a,[f,c])=>a+(f||0)+(c||0),0);
    const cl = e.sets.reduce((a,[f,c])=>a+(c||0),0);
    return tot > 0 ? Math.round(cl/tot*100) : 0;
  }
  function holdTot(s) { return s.hold_sets ? s.hold_sets.filter(v=>v!=null).reduce((a,v)=>a+(v||0),0) : null; }

  cont.innerHTML = [
    chartHTML('Hold max — PR verticale', 'var(--purple)', s => s.hold_max ?? null, false),
    chartHTML('Hold lavoro — totale sessione', 'var(--purple)', holdTot, false),
    chartHTML('S5 Spinta orizz. — rep S1', 'var(--teal)', s => { const r = s.p1?.s5?.sets?.[0]; return r ? (r[0]||0)+(r[1]||0) : null; }, false),
    chartHTML('S1 Tirata orizz. — rep S1', 'var(--teal)', s => { const r = s.p1?.s1?.sets?.[0]; return r ? (r[0]||0)+(r[1]||0) : null; }, false),
    chartHTML('S7 Spinta vert. — PR"', 'var(--amber)', s => s.p2?.s7?.hold_max ?? null, false),
    chartHTML('S7 Spinta vert. — tot."', 'var(--amber)', s => totExTime(s,'p2','s7'), false),
    chartHTML('S3 Tirata vert. — rep S1', 'var(--coral)', s => { const r = s.p2?.s3?.sets?.[0]; return r ? (r[0]||0)+(r[1]||0) : null; }, false),
    chartHTML('S5 cluster % — trend →0', 'var(--amber)', s => clPct(s,'p1','s5'), true),
    chartHTML('S1 cluster % — trend →0', 'var(--amber)', s => clPct(s,'p1','s1'), true),
  ].filter(Boolean).join('') || '<div class="history-empty">Dati insufficienti.</div>';
}

// ── NAME / TABS ──
function openNameModal() { document.getElementById('name-modal').classList.add('open'); setTimeout(() => document.getElementById('name-input').focus(), 100); }
function saveName() {
  const v = document.getElementById('name-input').value.trim();
  if (!v) return;
  localStorage.setItem(KEY_NAME, v);
  document.getElementById('name-badge').textContent = v;
  document.getElementById('name-modal').classList.remove('open');
  currentSess = 1; currentStep = 0;
  const nums = Object.keys(getData()).map(Number).filter(n => !isNaN(n));
  if (nums.length) currentSess = Math.max(...nums);
  renderStepDots(); renderStep(); renderHistory(); renderProgress();
}
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', ['log','history','progress'][i] === t));
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  if (t === 'history') renderHistory();
  if (t === 'progress') renderProgress();
}

init();
</script>
